    render();
  },
  async doExportProducts(t){
    const format = t.dataset.format;
    const list = currentProductExportList();
    state.ui.modal = null; render();
    if(format==='csv') await exportProductsCSV(list);
    else if(format==='xlsx') await exportProductsXLSX(list);
    else if(format==='html') await exportProductsHTML(list);
    notify.ok('Produtos exportados em '+format.toUpperCase()+'.');
  },
  confirmBulkImages(){
    const items = state.ui.modal.items.filter(i=> !i.error && i.productId && i.dataUrl);
    if(!items.length){ notify.err('Nenhuma foto foi vinculada a um produto.'); return; }
    const byProduct = {};
    items.forEach(i=>{ byProduct[i.productId] = i.dataUrl; }); // last one wins if duplicated
    let count = 0;
    state.products = state.products.map(p=>{
      if(byProduct[p.id]){ count++; return {...p, image: byProduct[p.id]}; }
      return p;
    });
    persist('products');
    state.ui.modal = null;
    render();
    notify.ok(count+' produto(s) receberam foto.');
  },
  confirmImport(){
    const m = state.ui.modal;
    const mapping = m.mapping;
    if(!Object.values(mapping).includes('name')){ notify.err('Mapeie a coluna do Nome antes de importar.'); return; }
    const newProducts = [];
    m.rows.forEach(r=>{
      const obj = {};
      Object.keys(mapping).forEach(idx=>{ const field = mapping[idx]; if(field) obj[field] = r[idx]!=null? String(r[idx]).trim() : ''; });
      if(!obj.name) return;
      const costPrice = parseNumberBR(obj.costPrice) || 0;
      let salePrice = parseNumberBR(obj.salePrice);
      let markup = parseNumberBR(obj.markup);
      if(isNaN(salePrice) && !isNaN(markup)) salePrice = +(costPrice*(1+markup/100)).toFixed(2);
      if(isNaN(markup) && !isNaN(salePrice) && costPrice>0) markup = +(((salePrice-costPrice)/costPrice)*100).toFixed(2);
      if(isNaN(salePrice)) salePrice = 0;
      if(isNaN(markup)) markup = 0;
      const stock = parseInt(String(obj.stock||'0').replace(/[^\d-]/g,''))||0;
      const minStock = parseInt(String(obj.minStock||'0').replace(/[^\d-]/g,''))||0;
      const maxStockRaw = String(obj.maxStock||'').replace(/[^\d-]/g,'');
      const maxStock = maxStockRaw!=='' ? (parseInt(maxStockRaw)||0) : null;
      newProducts.push({ id:uid('prod'), name:obj.name, category:obj.category||'', subcategory:obj.subcategory||'', image:obj.image||'', costPrice, salePrice, markup, stock, minStock, maxStock, active:true,
        description:obj.description||'', sku:obj.sku||'', brand:obj.brand||'', volume:obj.volume||'', supplier:obj.supplier||'', createdAt:new Date().toISOString() });
    });
    state.products = state.products.concat(newProducts);
    persist('products');
    // auto-register any category/subgroup names found in the file so they show up in the sidebar and manager
    const seenPairs = new Set();
    newProducts.forEach(p=>{
      if(p.category) actions.registerCategoryIfNew(p.category);
      const key = p.category+'|'+p.subcategory;
      if(p.subcategory && !seenPairs.has(key)){ actions.registerSubcategoryIfNew(p.subcategory, p.category||''); seenPairs.add(key); }
    });
    state.ui.modal = null;
    render();
    notify.ok(newProducts.length+' produto(s) importado(s) com sucesso.');
    standardizeImportedImages(newProducts.filter(p=>p.image).map(p=>p.id));
  },
  editProduto(t){ const p = state.products.find(x=>x.id===t.dataset.id); state.ui.modal = {type:'produto', data:{...p}}; render(); },
  setCatalogoSubView(t){ state.ui.catalogoSubView = t.dataset.view; render(); },
  async openFixBlackBg(){
    state.ui.addMenuOpen = false;
    state.ui.modal = {type:'fixBg', scanning:true, items:[]}; render();
    const items = await scanBlackBackgrounds();
    if(state.ui.modal && state.ui.modal.type==='fixBg'){ state.ui.modal = {type:'fixBg', scanning:false, items}; render(); }
  },
  toggleFixBg(t){
    const it = (state.ui.modal.items||[]).find(x=>x.id===t.dataset.id); if(it) it.checked = !it.checked; render();
  },
  applyFixBg(){
    const items = (state.ui.modal.items||[]).filter(i=>i.checked); let n=0;
    items.forEach(it=>{ const p = state.products.find(x=>x.id===it.id); if(p){ p.image = it.after; n++; } });
    if(n){ persist('products'); }
    state.ui.modal = null; render();
    notify.ok(n+' foto(s) corrigida(s). O catálogo do site atualiza depois da sincronização.');
  },
  async copyCatalogLink(){
    const url = /^https?:/i.test(location.protocol) ? new URL('catalogo.php', location.href).href : 'catalogo.php';
    try{ await navigator.clipboard.writeText(url); notify.ok('Link copiado: '+url); }catch(e){ notify.ok('Link do catálogo: '+url); }
  },
  openCatalogPage(){
    let list = state.ui.catalogOnlyAvailable ? state.products.filter(p=>p.stock>0) : state.products;
    if(!state.ui.catalogShowInactive) list = list.filter(p=> p.active!==false);
    if(!list.length){ notify.err('Nenhum produto para incluir na página pública.'); return; }
    const url = URL.createObjectURL(new Blob([buildCatalogPageHTML(list)], {type:'text/html;charset=utf-8;'}));
    const w = window.open(url, '_blank');
    if(!w) notify.err('O navegador bloqueou a nova aba. Permita pop-ups para abrir a página.');
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
  },
  async exportCatalogPage(){
    let list = state.ui.catalogOnlyAvailable ? state.products.filter(p=>p.stock>0) : state.products;
    if(!state.ui.catalogShowInactive) list = list.filter(p=> p.active!==false);
    if(!list.length){ notify.err('Nenhum produto para incluir na página pública.'); return; }
    const html = buildCatalogPageHTML(list);
    const blob = new Blob([html], {type:'text/html;charset=utf-8;'});
    await saveFile('catalogo.html', blob);
    notify.ok('Página gerada com '+list.length+' produto(s). Suba o catalogo.html para o mesmo site do sistema.');
  },
  toggleProductActive(t){
    const prod = state.products.find(p=>p.id===t.dataset.id);
    if(!prod) return;
    const willBeActive = prod.active===false;
    state.products = state.products.map(p=> p.id===prod.id? {...p, active: willBeActive} : p);
    persist('products');
    render();
    notify.ok(prod.name+(willBeActive? ' ativado.' : ' desativado.'));
  },
  toggleProductSelect(t){
    const id = t.dataset.id;
    const sel = state.ui.selectedProducts;
    const i = sel.indexOf(id);
    if(i>=0) sel.splice(i,1); else sel.push(id);
    render();
  },
  toggleSelectAllProducts(){
    const q = state.ui.productQuery.toLowerCase();
    const list = state.products.filter(p=> (p.name+p.category).toLowerCase().includes(q));
    const sel = state.ui.selectedProducts;
    const allSelected = list.length>0 && list.every(p=> sel.includes(p.id));
    if(allSelected){
      // unselect only the ones currently visible
      state.ui.selectedProducts = sel.filter(id=> !list.some(p=>p.id===id));
    } else {
      list.forEach(p=>{ if(!sel.includes(p.id)) sel.push(p.id); });
    }
    render();
  },
  clearProductSelection(){ state.ui.selectedProducts = []; render(); },
  deleteSelectedProducts(){
    const sel = state.ui.selectedProducts;
    if(!sel.length){ notify.err('Nenhum produto selecionado.'); return; }
    const names = state.products.filter(p=>sel.includes(p.id)).map(p=>p.name);
    const preview = names.slice(0,5).join(', ') + (names.length>5? ' e mais '+(names.length-5)+'...' : '');
    if(!confirm('Excluir '+sel.length+' produto(s)?\n\n'+preview+'\n\nEssa ação não pode ser desfeita.')) return;
    state.products = state.products.filter(p=> !sel.includes(p.id));
    persist('products');
    state.ui.selectedProducts = [];
    render();
    notify.ok(names.length+' produto(s) excluído(s).');
  },
  deleteProduto(t){
    const prod = state.products.find(p=>p.id===t.dataset.id);
    if(!confirm('Excluir o produto "'+(prod? prod.name : '')+'"?')) return;
    state.products = state.products.filter(p=>p.id!==t.dataset.id);
    state.ui.selectedProducts = state.ui.selectedProducts.filter(id=>id!==t.dataset.id);
    persist('products'); render();
    notify.ok('Produto excluído.');
  },
  productCostChange(){
    const d = state.ui.modal.data;
    const cost = parseFloat(d.costPrice)||0, markup = parseFloat(d.markup)||0;
    d.salePrice = +(cost*(1+markup/100)).toFixed(2);
  },
  productMarkupChange(){
    const d = state.ui.modal.data;
    const cost = parseFloat(d.costPrice)||0, markup = parseFloat(d.markup)||0;
    d.salePrice = +(cost*(1+markup/100)).toFixed(2);
  },
  productSalePriceChange(){
    const d = state.ui.modal.data;
    const cost = parseFloat(d.costPrice)||0, sale = parseFloat(d.salePrice)||0;
    d.markup = cost>0 ? +(((sale-cost)/cost)*100).toFixed(2) : 0;
  },
  registerCategoryIfNew(name){
    name = (name||'').trim();
    if(!name) return;
    if(!state.categories.some(c=>c.name.toLowerCase()===name.toLowerCase())){
      state.categories.push({id:uid('cat'), name});
      persist('categories');
    }
  },
  registerSubcategoryIfNew(name, category){
    name = (name||'').trim();
    if(!name) return;
    if(!state.subcategories.some(sc=>sc.name.toLowerCase()===name.toLowerCase() && sc.category===category)){
      state.subcategories.push({id:uid('subcat'), name, category:category||''});
      persist('subcategories');
    }
  },
  submitProduto(){
    const d = state.ui.modal.data;
    if(!d.name || !d.name.trim()){ notify.err('Informe o nome do produto.'); return; }
    const clean = {...d,
      costPrice: Math.max(0, parseFloat(d.costPrice)||0),
      salePrice: Math.max(0, parseFloat(d.salePrice)||0),
      markup: Math.max(0, parseFloat(d.markup)||0),
      stock: Math.max(0, parseInt(d.stock)||0),
      minStock: Math.max(0, parseInt(d.minStock)||0),
      maxStock: d.maxStock? Math.max(0, parseInt(d.maxStock)||0) : null,
      active: d.active!==false
    };
    if(clean.id){ state.products = state.products.map(p=> p.id===clean.id? clean : p); }
    else { state.products.push({...clean, id:uid('prod'), createdAt:new Date().toISOString()}); }
    actions.registerCategoryIfNew(clean.category);
    actions.registerSubcategoryIfNew(clean.subcategory, (clean.category||'').trim());
    persist('products'); state.ui.modal=null; render();
    notify.ok(clean.id? 'Produto atualizado.' : 'Produto cadastrado.');
  }
};

          <td style="text-align:right;" class="muted">${p.minStock||0}</td>
          <td style="text-align:right;" class="muted">${p.maxStock!=null? p.maxStock : '—'}</td>

      }).join('')}

/* ================= inventário (contagem de estoque) ================= */
let INV = LS.get('ess_inventory', null);          // contagem em andamento
let INV_HIST = LS.get('ess_inv_hist', []);        // contagens já aplicadas
function invSave(){ if(INV) LS.set('ess_inventory', INV); else { try{ localStorage.removeItem('ess_inventory'); }catch(e){} } }
function invHistSave(){ LS.set('ess_inv_hist', INV_HIST.slice(0,30)); }
function invFilters(){ return state.ui.invF || (state.ui.invF = {cat:'', zero:false, blind:false, q:'', show:'todos'}); }
function invProducts(f){
  f = f || invFilters();
  return state.products.filter(p=> p.active!==false && (f.zero || p.stock>0) && (!f.cat || (p.category||'Sem categoria')===f.cat));
}
function invItemRows(ids){
  // linhas na ordem categoria > subgrupo > nome (mesma do catálogo)
  const list = state.products.filter(p=> ids.indexOf(p.id)>=0);
  const out = [];
  catalogStructure(list).forEach(g=> g.subs.forEach(sub=> sub.items.forEach(p=> out.push({p, cat:g.name, sub:sub.name}))));
  return out;
}
function invSetCount(id, raw){
  if(!INV) return;
  const v = String(raw).trim();
  if(v==='') delete INV.counts[id]; else { const n = parseInt(v,10); if(isNaN(n)||n<0) return; INV.counts[id] = n; }
  invSave();
  const it = INV.items.find(x=>x.id===id); const cell = document.getElementById('invdiff-'+id);
  if(it && cell){ const c = INV.counts[id]; if(c===undefined){ cell.innerHTML = '<span class="muted2">—</span>'; } else { const d = c - it.sys; cell.innerHTML = d===0 ? '<span class="badge-ok">confere</span>' : `<span class="${d>0?'ok-c':'danger-c'}" style="font-weight:600;">${d>0?'+':''}${d}</span>`; } }
  const sum = document.getElementById('inv-summary'); if(sum) sum.innerHTML = invSummaryHTML();
}
function invStats(){
  const items = INV.items; let counted=0, diverg=0, net=0, netValue=0;
  items.forEach(it=>{ const c = INV.counts[it.id]; if(c===undefined) return; counted++; const d = c-it.sys; if(d!==0){ diverg++; net+=d; const p = state.products.find(x=>x.id===it.id); netValue += d*((p&&p.costPrice)||0); } });
  return {total:items.length, counted, pending:items.length-counted, diverg, net, netValue};
}
function invSummaryHTML(){
  const st = invStats(); const pct = st.total? Math.round(st.counted/st.total*100) : 0;
  const box = (l,v,sub)=>`<div class="card" style="padding:12px 14px;"><div class="muted" style="font-size:11px;">${l}</div><div class="serif" style="font-size:20px;color:var(--plum);">${v}</div>${sub?`<div class="muted2" style="font-size:11px;">${sub}</div>`:''}</div>`;
  return `
    <div class="grid mb2" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));">
      ${box('Contados', st.counted+' de '+st.total, pct+'% concluído')}
      ${box('Pendentes', st.pending, '')}
      ${box('Divergências', `<span class="${st.diverg?'danger-c':''}">${st.diverg}</span>`, 'diferem do sistema')}
      ${box('Diferença líquida', (st.net>0?'+':'')+st.net+' un.', 'a custo: '+brl(st.netValue))}
    </div>
    <div style="height:6px;background:var(--tint);border-radius:4px;overflow:hidden;margin-bottom:14px;"><div style="height:100%;width:${pct}%;background:var(--gold);"></div></div>`;
}
function invCatOptions(sel){
  const names = []; state.categories.forEach(c=>{ if(c.name) names.push(c.name); });
  state.products.forEach(p=>{ const n=p.category||'Sem categoria'; if(names.indexOf(n)<0) names.push(n); });
  return `<option value="">Todas as categorias</option>` + names.map(n=>`<option value="${esc(n)}" ${sel===n?'selected':''}>${esc(n)}</option>`).join('');
}

/* impressão via iframe oculto (não depende de pop-up liberado) */
function printHTML(html){
  const fr = document.createElement('iframe');
  fr.setAttribute('aria-hidden','true');
  fr.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;';
  document.body.appendChild(fr);
  const doc = fr.contentDocument || fr.contentWindow.document;
  doc.open(); doc.write(html); doc.close();
  setTimeout(()=>{ try{ fr.contentWindow.focus(); fr.contentWindow.print(); }catch(e){ notify.err('Não foi possível abrir a impressão. Tente de novo.'); } setTimeout(()=>{ try{ fr.remove(); }catch(e){} }, 60000); }, 350);
}
function invPrintCSS(){
  return `@page{size:A4;margin:12mm 10mm;}
  *{box-sizing:border-box;} body{font-family:'Segoe UI',system-ui,Arial,sans-serif;font-size:11.5px;color:#111;margin:0;}
  h1{font-size:18px;margin:0;letter-spacing:.06em;} .sub{color:#555;font-size:11px;margin:2px 0 10px;}
  .meta{display:flex;gap:18px;flex-wrap:wrap;border:1px solid #999;padding:8px 10px;margin-bottom:10px;font-size:11px;}
  .meta span b{display:inline-block;min-width:60px;} .line{display:inline-block;border-bottom:1px solid #000;min-width:150px;height:13px;vertical-align:bottom;}
  h2{font-size:13px;margin:14px 0 4px;padding:3px 6px;background:#e8e8ee;border-left:4px solid #17204A;break-after:avoid;}
  h3{font-size:11.5px;margin:8px 0 3px;color:#444;break-after:avoid;}
  table{width:100%;border-collapse:collapse;margin-bottom:4px;}

  .sm{color:#666;font-size:10px;} .neg{color:#b00020;font-weight:700;} .pos{color:#0a6b3d;font-weight:700;}
  .sign{display:flex;gap:30px;margin-top:26px;font-size:11px;break-inside:avoid;} .sign div{flex:1;border-top:1px solid #000;padding-top:3px;text-align:center;}
  .foot{margin-top:8px;color:#666;font-size:10px;}`;
}
function invPrintDoc(title, bodyHTML){
  return `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>${esc(title)}</title><style>${invPrintCSS()}</style></head><body>${bodyHTML}</body></html>`;
}
function invGroupedTable(rows, cols, rowFn){
  // rows: [{p,cat,sub,...}] ja ordenadas; agrupa por categoria > subgrupo
  let html = '', lastCat=null, lastSub=null, open=false, idx=0;
  const closeT = ()=>{ if(open){ html += '</tbody></table>'; open=false; } };
  rows.forEach(r=>{
    if(r.cat!==lastCat){ closeT(); html += `<h2>${esc(r.cat)}</h2>`; lastCat=r.cat; lastSub=null; }
    if(r.sub!==lastSub || !open){ closeT(); if(r.sub) html += `<h3>${esc(r.sub)}</h3>`; html += `<table><thead><tr>${cols.map(c=>`<th${c.cls?` class="${c.cls}"`:''}${c.w?` style="width:${c.w}"`:''}>${c.t}</th>`).join('')}</tr></thead><tbody>`; open=true; lastSub=r.sub; }
    html += rowFn(r, ++idx);
  });
  closeT();
  return html;
}
function invHeaderHTML(title, note, extraMeta){
  const now = new Date();
  return `<h1>ESSÊNCIA · ${esc(title)}</h1><div class="sub">${esc(note||'')}</div>
  <div class="meta"><span><b>Data:</b> ${now.toLocaleDateString('pt-BR')}</span><span><b>Impresso:</b> ${now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</span>${extraMeta||''}</div>`;
}

const actions_inventario = {
  setEstoqueView(t){ state.ui.estoqueView = t.dataset.view; render(); },
  setInvShow(t){ invFilters().show = t.dataset.show; render(); },
  startInventory(){
    const f = invFilters(); const list = invProducts(f);
    if(!list.length){ notify.err('Nenhum produto para contar com esse filtro.'); return; }
    INV = { startedAt:new Date().toISOString(), by:(state.currentUser&&state.currentUser.name)||'', cat:f.cat||'', items:list.map(p=>({id:p.id, sys:p.stock})), counts:{} };
    invSave(); state.ui.invF.q=''; state.ui.invF.show='todos'; render();
  },
  invZero(t){ invSetCount(t.dataset.id, '0'); const inp = document.querySelector('[data-inv-count="'+t.dataset.id.replace(/"/g,'')+'"]'); if(inp) inp.value = '0'; },
  cancelInventory(){
    if(!INV) return;
    if(!confirm('Cancelar a contagem em andamento? O que foi digitado será descartado. O estoque não será alterado.')) return;
    INV = null; invSave(); render();
  },
  applyInventory(){
    if(!INV) return;
    const st = invStats();
    if(st.counted===0){ notify.err('Nenhum item foi contado ainda.'); return; }
    const changes = INV.items.filter(it=> INV.counts[it.id]!==undefined && state.products.some(p=>p.id===it.id));
    const toAdjust = changes.filter(it=>{ const p = state.products.find(x=>x.id===it.id); return p.stock !== INV.counts[it.id]; });
    const msg = 'Aplicar a contagem ao estoque?\n\n'+st.counted+' item(ns) contado(s), '+toAdjust.length+' será(ão) ajustado(s).'+(st.pending?'\n'+st.pending+' item(ns) não contado(s) ficam como estão.':'')+'\n\nEsta ação altera o estoque dos produtos.';
    if(!confirm(msg)) return;
    const entry = { appliedAt:new Date().toISOString(), startedAt:INV.startedAt, by:(state.currentUser&&state.currentUser.name)||INV.by||'', counted:st.counted, adjusted:toAdjust.length, net:0, lines:[] };
    toAdjust.forEach(it=>{
      const p = state.products.find(x=>x.id===it.id); const c = INV.counts[it.id];
      entry.lines.push({id:p.id, name:p.name, sku:p.sku||'', category:p.category||'Sem categoria', before:p.stock, after:c, diff:c-p.stock});
      entry.net += c-p.stock; p.stock = c;
    });
    if(toAdjust.length) persist('products');
    INV_HIST.unshift(entry); invHistSave();
    INV = null; invSave(); render();
    notify.ok('Inventário aplicado: '+toAdjust.length+' produto(s) ajustado(s).');
  },
  printCountSheet(){
    const f = invFilters(); const list = invProducts(f);
    if(!list.length){ notify.err('Nenhum produto para imprimir.'); return; }
    const rows = invItemRows(list.map(p=>p.id));
    const blind = !!f.blind;
    const cols = [{t:'#',cls:'i'},{t:'Código',cls:'sku'},{t:'Produto'}].concat(blind?[]:[{t:'Sistema',cls:'n'}]).concat([{t:'Contagem',cls:'box'},{t:'Observação',cls:'obs'}]);
    const tbl = invGroupedTable(rows, cols, (r,i)=>`<tr><td class="i">${i}</td><td class="sku">${esc(r.p.sku||'')}</td><td>${esc(r.p.name)}${(r.p.brand||r.p.volume)?`<div class="sm">${esc([r.p.brand, r.p.volume&&/^\d+$/.test(String(r.p.volume).trim())?r.p.volume+'ml':r.p.volume].filter(Boolean).join(' · '))}</div>`:''}</td>${blind?'':`<td class="n">${r.p.stock}</td>`}<td class="box"></td><td class="obs"></td></tr>`);
    const total = list.reduce((a,p)=>a+p.stock,0);
    const html = invPrintDoc('Folha de contagem', invHeaderHTML('Inventário de estoque','Folha de contagem física'+(f.cat?' · '+f.cat:''),
      `<span><b>Local/Setor:</b> <span class="line"></span></span>`)
      + tbl
      + `<div class="foot">${list.length} produto(s)${blind?' · contagem cega':' · total no sistema: '+total+' un.'}</div>`
      + `<div class="sign"><div>Contado por</div><div>Conferido por</div><div>Data</div></div>`);
    printHTML(html);
  },
  printInvResult(){
    if(!INV) return;
    const rows = invItemRows(INV.items.map(i=>i.id));
    const cols = [{t:'#',cls:'i'},{t:'Código',cls:'sku'},{t:'Produto'},{t:'Sistema',cls:'n'},{t:'Contado',cls:'n'},{t:'Diferença',cls:'n'},{t:'Observação',cls:'obs'}];
    const tbl = invGroupedTable(rows, cols, (r,i)=>{ const it = INV.items.find(x=>x.id===r.p.id); const c = INV.counts[r.p.id]; const d = c===undefined?null:c-it.sys;
      return `<tr><td class="i">${i}</td><td class="sku">${esc(r.p.sku||'')}</td><td>${esc(r.p.name)}</td><td class="n">${it.sys}</td><td class="n">${c===undefined?'':c}</td><td class="n ${d>0?'pos':d<0?'neg':''}">${d===null?'':(d>0?'+':'')+d}</td><td class="obs"></td></tr>`; });
    const st = invStats();
    const html = invPrintDoc('Conferência de inventário', invHeaderHTML('Conferência de inventário','Contagem iniciada em '+fmtDate(INV.startedAt),
      `<span><b>Responsável:</b> ${esc(INV.by||'')}</span>`)
      + tbl
      + `<div class="foot">${st.counted} de ${st.total} contado(s) · ${st.diverg} divergência(s) · diferença líquida ${st.net>0?'+':''}${st.net} un.</div>`
      + `<div class="sign"><div>Contado por</div><div>Conferido por</div><div>Data</div></div>`);
    printHTML(html);
  },
  printInvHistory(t){
    const h = INV_HIST[parseInt(t.dataset.idx,10)]; if(!h) return;
    const rows = h.lines.map(l=>({p:{id:l.id,name:l.name,sku:l.sku}, cat:l.category, sub:'', l}));
    const cols = [{t:'#',cls:'i'},{t:'Código',cls:'sku'},{t:'Produto'},{t:'Antes',cls:'n'},{t:'Contado',cls:'n'},{t:'Diferença',cls:'n'}];
    const tbl = rows.length ? invGroupedTable(rows, cols, (r,i)=>`<tr><td class="i">${i}</td><td class="sku">${esc(r.l.sku)}</td><td>${esc(r.l.name)}</td><td class="n">${r.l.before}</td><td class="n">${r.l.after}</td><td class="n ${r.l.diff>0?'pos':'neg'}">${r.l.diff>0?'+':''}${r.l.diff}</td></tr>`) : '<p>Nenhum ajuste foi necessário: todas as quantidades conferiam.</p>';
    printHTML(invPrintDoc('Inventário aplicado', invHeaderHTML('Inventário aplicado','Aplicado em '+fmtDate(h.appliedAt),`<span><b>Responsável:</b> ${esc(h.by||'')}</span>`) + tbl
      + `<div class="foot">${h.counted} contado(s) · ${h.adjusted} ajustado(s) · diferença líquida ${h.net>0?'+':''}${h.net} un.</div>`));
  },
  async exportInvCSV(){
    if(!INV) return;
    const q = v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
    const lines = [['Categoria','Subgrupo','Código','Produto','Sistema','Contado','Diferença'].map(q).join(';')];
    invItemRows(INV.items.map(i=>i.id)).forEach(r=>{ const it = INV.items.find(x=>x.id===r.p.id); const c = INV.counts[r.p.id];
      lines.push([r.cat, r.sub, r.p.sku||'', r.p.name, it.sys, c===undefined?'':c, c===undefined?'':c-it.sys].map(q).join(';')); });
    await saveFile('inventario-'+todayISO()+'.csv', new Blob(['\uFEFF'+lines.join('\r\n')], {type:'text/csv;charset=utf-8;'}));
    notify.ok('Arquivo CSV gerado.');
  }
};

const actions_estoque = {

}

function filteredSales(){
  const f = vendaFilters(); const q = (f.q||'').trim().toLowerCase();
  return state.sales.filter(x=>{
    if(f.status==='concluida' && x.status==='cancelada') return false;
    if(f.status==='cancelada' && x.status!=='cancelada') return false;
    if(f.method && !x.payments.some(p=>p.method===f.method)) return false;
    const day = localDay(x.date);
    if(f.from && day<f.from) return false;
    if(f.to && day>f.to) return false;
    if(q && !((x.customerName||'').toLowerCase().includes(q) || x.items.some(i=>(i.name||'').toLowerCase().includes(q)))) return false;
    return true;
  }).sort((a,b)=> new Date(b.date)-new Date(a.date));
}

const actions_vendas = {
  setVendaView(t){ state.ui.vendaView = t.dataset.view; render(); },
  setCaixaRange(t){
    const k=t.dataset.range, today=todayISO();
    if(k==='hoje'){ state.ui.caixaFrom=today; state.ui.caixaTo=today; }
    else if(k==='7d'){ state.ui.caixaFrom=daysAgoISO(6); state.ui.caixaTo=today; }
    else if(k==='mes'){ state.ui.caixaFrom=today.slice(0,8)+'01'; state.ui.caixaTo=today; }
    render();
  },
  filterCaixaMethod(t){ const m=t.dataset.method||''; state.ui.caixaMethod = (state.ui.caixaMethod===m)?'':m; render(); },
  setVendaStatusFilter(t){ vendaFilters().status = t.dataset.status||''; render(); },
  clearVendaFilters(){ state.ui.vf = {q:'',status:'',method:'',from:'',to:''}; render(); },
  clearCart(){ if(!state.ui.venda.cart.length) return; if(!confirm('Esvaziar o carrinho?')) return; state.ui.venda.cart = []; render(); },
  fillPaymentTotal(){
    const V = state.ui.venda; const sub = V.cart.reduce((a,i)=>a+i.qty*i.unitPrice,0);
    const total = Math.max(0, sub - computeDiscountAmount(sub, V.discount, V.discountType));
    if(V.payments.length===1){ V.payments[0].amount = total.toFixed(2); render(); }
  },
  vendaSearchEnter(){ const r = searchProducts(state.ui.venda.search); if(r.length) actions.addToCart({dataset:{id:r[0].id}}); },
  pedidoSearchEnter(){ const r = searchProducts(state.ui.pedido.search); if(r.length) actions.pedidoAddToCart({dataset:{id:r[0].id}}); },
  addToCart(t){
    const p = state.products.find(x=>x.id===t.dataset.id);
    if(!p){ return; }
    if(p.active===false){ notify.err('Este produto está desativado e não pode ser vendido. Reative-o no Catálogo.'); return; }
    if(p.stock<=0){ notify.err('Produto sem estoque disponível.'); return; }
    const V = state.ui.venda;
    const existing = V.cart.find(i=>i.productId===p.id);
    if(existing){
      if(existing.qty+1>p.stock){ notify.err('Quantidade maior que o estoque disponível.'); return; }
      existing.qty++;
    } else {
      V.cart.push({productId:p.id, name:p.name, qty:1, unitPrice:p.salePrice, stock:p.stock});
    }
    V.search='';
    render();
  },
  cartQtyInc(t){
    const V = state.ui.venda; const item = V.cart.find(i=>i.productId===t.dataset.id);
    if(item && item.qty<item.stock) item.qty++;
    render();
  },
  cartQtyDec(t){
    const V = state.ui.venda; const item = V.cart.find(i=>i.productId===t.dataset.id);
    if(item && item.qty>1) item.qty--;
    render();
  },
  removeFromCart(t){
    const V = state.ui.venda; V.cart = V.cart.filter(i=>i.productId!==t.dataset.id); render();
  },
  setDiscountType(t){ state.ui.venda.discountType = t.dataset.type; render(); },
  addPayment(){ state.ui.venda.payments.push({method:'Dinheiro',amount:''}); render(); },
  removePayment(t){ const V = state.ui.venda; V.payments.splice(parseInt(t.dataset.idx),1); render(); },
  finalizarVenda(){
    const V = state.ui.venda;
    if(V.cart.length===0){ notify.err('Adicione ao menos um produto.'); return; }
    const subtotal = V.cart.reduce((a,i)=>a+i.qty*i.unitPrice,0);
    const discount = computeDiscountAmount(subtotal, V.discount, V.discountType);
    const total = Math.max(0, subtotal-discount);
    const paid = V.payments.reduce((a,p)=>a+Math.max(0, parseFloat(p.amount)||0),0);
    if(Math.abs(+(total-paid).toFixed(2))>0.009){ notify.err('O valor pago precisa ser igual ao total da venda.'); return; }
    const customer = state.customers.find(c=>c.id===V.customerId);
    const sale = {
      id:uid('venda'), date:new Date().toISOString(), customerId:V.customerId||null,
      customerName: customer? customer.name : 'Consumidor Final',
      items: V.cart.map(i=>({productId:i.productId,name:i.name,qty:i.qty,unitPrice:i.unitPrice,subtotal:+(i.qty*i.unitPrice).toFixed(2)})),
      subtotal:+subtotal.toFixed(2), discount:+discount.toFixed(2), total:+total.toFixed(2),
      payments: V.payments.filter(p=>parseFloat(p.amount)>0).map(p=>({method:p.method, amount:+parseFloat(p.amount).toFixed(2)})),
      status:'concluida'
    };
    state.sales.unshift(sale); persist('sales');
    state.products = state.products.map(p=>{
      const item = sale.items.find(i=>i.productId===p.id);
      return item ? {...p, stock: Math.max(0, p.stock-item.qty)} : p;
    });
    persist('products');
    state.ui.venda = {customerId:'',search:'',cart:[],discount:0,discountType:'value',payments:[{method:'Dinheiro',amount:''}]};
    state.ui.vendaView='lista';
    render();
  },
  viewSale(t){ state.ui.saleDetail = state.sales.find(s=>s.id===t.dataset.id); render(); },
  cancelSale(t){
    if(!confirm('Cancelar esta venda? O estoque será restaurado.')) return;
    const sale = state.sales.find(s=>s.id===t.dataset.id);
    state.sales = state.sales.map(s=> s.id===sale.id? {...s,status:'cancelada'} : s);
    persist('sales');
    state.products = state.products.map(p=>{
      const item = sale.items.find(i=>i.productId===p.id);
      return item ? {...p, stock:p.stock+item.qty} : p;
    });
    persist('products'); render();
  },
  closeSaleDetail(){ state.ui.saleDetail=null; render(); },
  viewCustomer(t){ state.ui.modal = {type:'customerHistory', customerId:t.dataset.id}; render(); },
  printReceipt(t){ printReceipt(t.dataset.id); },
  async exportSalesCSV(){
    const f=state.ui.relFrom, to=state.ui.relTo;
    const list = state.sales.filter(s=>s.status!=='cancelada' && localDay(s.date)>=f && localDay(s.date)<=to);
    if(!list.length){ notify.err('Nenhuma venda no período selecionado.'); return; }
    const rows=[['Data','Cliente','Produto','Qtd','Preco Unit','Subtotal','Desconto Venda','Total Venda','Pagamento']];
    list.forEach(s=> s.items.forEach(i=> rows.push([
      fmtDate(s.date), s.customerName, i.name, i.qty,
      i.unitPrice.toFixed(2).replace('.',','), i.subtotal.toFixed(2).replace('.',','),
      s.discount.toFixed(2).replace('.',','), s.total.toFixed(2).replace('.',','),
      s.payments.map(x=>x.method).join(' + ')
    ])));
    await downloadCSV('vendas-'+f+'-a-'+to+'.csv', rows);
    notify.ok('Relatório de vendas exportado.');
  },
  async exportStockCSV(){
    if(!state.products.length){ notify.err('Nenhum produto cadastrado.'); return; }
    const rows=[['SKU','Produto','Marca','Categoria','Subgrupo','Volume','Fornecedor','Estoque','Minimo','Maximo','Custo Unit','Venda Unit','Markup %','Valor Custo Total','Valor Venda Total']];
    state.products.forEach(p=> rows.push([
      p.sku||'', p.name, p.brand||'', p.category||'', p.subcategory||'', p.volume||'', p.supplier||'', p.stock, p.minStock||0, p.maxStock!=null?p.maxStock:'',
      (p.costPrice||0).toFixed(2).replace('.',','), (p.salePrice||0).toFixed(2).replace('.',','),
      (p.markup||0).toFixed(2).replace('.',','),
      (p.stock*(p.costPrice||0)).toFixed(2).replace('.',','), (p.stock*(p.salePrice||0)).toFixed(2).replace('.',',')
    ]));
    await downloadCSV('estoque-'+todayISO()+'.csv', rows);
    notify.ok('Relatório de estoque exportado.');
  },
  async exportPurchaseList(){
    const low = state.products.filter(p=>p.stock<=(p.minStock||0));
    if(!low.length){ notify.ok('Nenhum produto precisa de reposição no momento.'); return; }
    const rows=[['SKU','Produto','Marca','Fornecedor','Estoque Atual','Minimo','Sugestao Compra','Custo Unit','Custo Estimado']];
    low.forEach(p=>{
      const sug = Math.max(1, (p.minStock||0)*2 - p.stock);
      rows.push([p.sku||'', p.name, p.brand||'', p.supplier||'', p.stock, p.minStock||0, sug,
        (p.costPrice||0).toFixed(2).replace('.',','), (sug*(p.costPrice||0)).toFixed(2).replace('.',',')]);
    });
    await downloadCSV('lista-de-compras-'+todayISO()+'.csv', rows);
    notify.ok('Lista de compras gerada com '+low.length+' item(ns).');
  }
};

    <div class="card kpi kpi-link ${state.ui.pedidoView==='lista'&&state.ui.orderStatusFilter==='Faturado'&&state.ui.orderMonth?'on':''}" data-action="kpiOrders" data-status="Faturado" data-month="1" title="Ver pedidos faturados neste mês"><div class="klabel">Faturados no mês</div><div class="kval" style="font-size:22px;">${invoicedThisMonth.length}</div><div class="muted2" style="font-size:12px;margin-top:4px;">${brl(invoicedValue)}</div></div>
    <div class="card kpi kpi-link ${state.ui.pedidoView==='lista'&&state.ui.orderStatusFilter==='Rascunho'?'on':''}" data-action="kpiOrders" data-status="Rascunho" title="Ver rascunhos"><div class="klabel">Rascunhos</div><div class="kval" style="font-size:22px;">${state.orders.filter(o=>o.status==='Rascunho').length}</div></div>
    <div class="card kpi kpi-link ${state.ui.pedidoView==='lista'&&state.ui.orderStatusFilter==='Cancelado'?'on':''}" data-action="kpiOrders" data-status="Cancelado" title="Ver pedidos cancelados"><div class="klabel">Cancelados</div><div class="kval" style="font-size:22px;">${state.orders.filter(o=>o.status==='Cancelado').length}</div></div>
  </div>

  `;
}

function renderNovoPedido(){
  const P = state.ui.pedido;
  const editing = !!P.id;
  const subtotal = P.cart.reduce((a,i)=>a+i.qty*i.unitPrice,0);
  const discount = +computeDiscountAmount(subtotal, P.discount, P.discountType).toFixed(2);
  const shipping = Math.max(0, parseFloat(P.shipping)||0);
  const total = Math.max(0, subtotal - discount + shipping);
  const results = searchProducts(P.search);

  return `
  ${editing ? `<div class="banner-danger" style="background:#F6EFDD;color:var(--gold-deep);">Editando pedido <b>${esc(P.orderNumber)}</b>. <button class="icon-btn" data-action="cancelEditPedido" style="color:var(--gold-deep);text-decoration:underline;font-size:12px;">cancelar edição</button></div>` : ''}
  <div class="grid" style="grid-template-columns:3fr 2fr;">
    <div>
      <div class="card mb2">
        <label class="field"><span class="lbl">Cliente</span>
          <select data-field="ui.pedido.customerId">
            <option value="">Consumidor Final</option>
            ${state.customers.map(c=>`<option value="${c.id}" ${P.customerId===c.id?'selected':''}>${c.code?esc(c.code)+' · ':''}${esc(c.name)}</option>`).join('')}
          </select>
        </label>
        <div class="relative">
          <input placeholder="Buscar produto por código ou nome..." data-enter-action="pedidoSearchEnter" data-field="ui.pedido.search" value="${esc(P.search)}">
          ${results.length>0? `
          <div class="search-results">
            ${results.map(p=>`
              <div class="search-result-item" data-action="pedidoAddToCart" data-id="${p.id}">
                <span class="prodcell">${thumbHTML(p,34)}<span>${pcode(p)}${esc(p.name)}</span></span><span class="muted" style="white-space:nowrap;">${brl(p.salePrice)} · ${p.stock} un.</span>
              </div>`).join('')}
          </div>`:''}
        </div>
      </div>
      <div class="table-wrap">
        ${P.cart.length===0 ? emptyState(icon('clipboard',26),'Nenhum item no pedido','Busque produtos acima para adicionar ao pedido.') : `
        <table>
          <thead><tr><th>Produto</th><th style="text-align:center;">Qtd.</th><th style="text-align:right;">Preço</th><th style="text-align:right;">Subtotal</th><th></th></tr></thead>
          <tbody>
            ${P.cart.map(i=>`
              <tr>
                <td><div class="prodcell">${thumbHTML(state.products.find(x=>x.id===i.productId),44)}<span>${pcode(state.products.find(x=>x.id===i.productId))}${esc(i.name)}</span></div></td>
                <td style="text-align:center;white-space:nowrap;">
                  <button class="icon-btn" data-action="pedidoQtyDec" data-id="${i.productId}">${icon('minus',12)}</button>
                  <span style="display:inline-block;min-width:20px;text-align:center;">${i.qty}</span>
                  <button class="icon-btn" data-action="pedidoQtyInc" data-id="${i.productId}">${icon('plus',12)}</button>
                </td>
                <td style="text-align:right;">
                  <input type="number" step="0.01" min="0" style="width:90px;padding:5px 7px;font-size:12.5px;" data-field="ui.pedido.cart.${P.cart.indexOf(i)}.unitPrice" value="${i.unitPrice}">
                </td>
                <td style="text-align:right;">${brl(i.qty*i.unitPrice)}</td>
                <td style="text-align:right;"><button class="icon-btn danger-c" data-action="pedidoRemoveFromCart" data-id="${i.productId}">${icon('trash',14)}</button></td>
              </tr>`).join('')}
          </tbody>
        </table>`}
      </div>
      <div class="card" style="margin-top:16px;">
        <label class="field"><span class="lbl">Observações</span><input placeholder="Prazo combinado, instruções de entrega..." data-field="ui.pedido.notes" value="${esc(P.notes)}"></label>
        <label class="field" style="margin-bottom:0;"><span class="lbl">Previsão de entrega</span><input type="date" data-field="ui.pedido.expectedDate" value="${esc(P.expectedDate)}"></label>
      </div>
    </div>
    <div>
      <div class="card">
        <div class="flex-between" style="font-size:14px;margin-bottom:8px;"><span class="muted">Subtotal</span><span>${brl(subtotal)}</span></div>
        <label class="field"><span class="lbl">Desconto</span>
          <div class="flex gap">
            <input type="number" step="0.01" min="0" style="flex:1;" data-field="ui.pedido.discount" value="${esc(P.discount)}">
            <div class="segbar">
              <button class="${P.discountType!=='percent'?'on':''}" data-action="setPedidoDiscountType" data-type="value">R$</button>
              <button class="${P.discountType==='percent'?'on':''}" data-action="setPedidoDiscountType" data-type="percent">%</button>
            </div>
          </div>
          ${P.discountType==='percent' ? `<span class="hint">${Math.min(Math.max(0,parseFloat(P.discount)||0),100)}% = ${brl(discount)}</span>` : ''}
        </label>
        <label class="field"><span class="lbl">Frete (R$)</span><input type="number" step="0.01" min="0" data-field="ui.pedido.shipping" value="${esc(P.shipping)}"></label>
        <div class="flex-between serif" style="font-size:20px;margin-bottom:16px;color:var(--plum);"><span>Total</span><span>${brl(total)}</span></div>
        <button class="btn btn-ghost btn-block" style="margin-bottom:8px;" data-action="savePedido" data-status="Rascunho">${icon('save')} Salvar como rascunho</button>
        <button class="btn btn-gold btn-block" data-action="savePedido" data-status="Pendente">${icon('check')} ${editing?'Salvar e confirmar':'Confirmar pedido'}</button>
      </div>

  </div>`;
}

    .filter(o=> !q || (o.orderNumber+o.customerName).toLowerCase().includes(q))
    .filter(o=> !statusFilter || o.status===statusFilter)
    .filter(o=> !(state.ui.orderMonth && statusFilter==='Faturado') || (o.invoicedAt||o.createdAt||'').slice(0,7)===todayISO().slice(0,7))
    .slice().sort((a,b)=> new Date(b.createdAt)-new Date(a.createdAt));
  return `
  <div class="flex gap flex-wrap mb2" style="align-items:center;">
    <div class="relative" style="max-width:280px;flex:1;min-width:180px;">
      <input placeholder="Buscar por número ou cliente..." data-field="ui.orderQuery" value="${esc(state.ui.orderQuery||'')}">
    </div>
    <div class="segbar">
      <button class="${!statusFilter?'on':''}" data-action="filterOrderStatus" data-status="">Todos</button>
      ${ORDER_STATUSES.map(s=>`<button class="${statusFilter===s?'on':''}" data-action="filterOrderStatus" data-status="${s}">${s}</button>`).join('')}
    </div>

    <thead><tr><th>Número</th><th>Data</th><th>Cliente</th><th>Itens</th><th style="text-align:right;">Total</th><th style="text-align:center;">Status</th><th style="text-align:right;">Ações</th></tr></thead>
    <tbody>
      ${list.map(o=>`
        <tr style="opacity:${o.status==='Cancelado'?0.6:1};">
          <td><b>${esc(o.orderNumber)}</b></td>
          <td class="muted" style="white-space:nowrap;">${fmtDate(o.createdAt)}</td>
          <td>${esc(o.customerName)}</td>
          <td class="plum" style="cursor:pointer;" data-action="viewOrder" data-id="${o.id}">${o.items.length} item(ns)</td>
          <td style="text-align:right;">${brl(o.total)}</td>
          <td style="text-align:center;"><span class="${orderStatusBadgeClass(o.status)}">${esc(o.status)}</span></td>
          <td style="text-align:right;white-space:nowrap;">
            <button class="icon-btn plum" data-action="viewOrder" data-id="${o.id}" title="Detalhes">${icon('search',14)}</button>
            ${(o.status==='Rascunho'||o.status==='Pendente') ? `<button class="icon-btn plum" data-action="editPedido" data-id="${o.id}" title="Editar">${icon('edit',14)}</button>`:''}
            ${(o.status==='Rascunho'||o.status==='Pendente') ? `<button class="icon-btn ok-c" data-action="invoiceOrder" data-id="${o.id}" title="Faturar (converter em venda)">${icon('cart',14)}</button>`:''}
            <button class="icon-btn plum" data-action="printOrder" data-id="${o.id}" title="Imprimir">${icon('printer',14)}</button>
            ${(o.status!=='Cancelado'&&o.status!=='Faturado') ? `<button class="icon-btn danger-c" data-action="cancelOrder" data-id="${o.id}" title="Cancelar">${icon('xcircle',14)}</button>`:''}

const actions_pedidos = {
  setPedidoView(t){ state.ui.pedidoView = t.dataset.view; render(); },
  newPedido(){ state.ui.pedido = emptyPedido(); state.ui.pedidoView='nova'; render(); },
  pedidoAddToCart(t){
    const p = state.products.find(x=>x.id===t.dataset.id);
    if(!p){ return; }
    if(p.active===false){ notify.err('Este produto está desativado e não pode ser incluído em pedidos.'); return; }
    const P = state.ui.pedido;
    const existing = P.cart.find(i=>i.productId===p.id);
    if(existing){ existing.qty++; }
    else { P.cart.push({productId:p.id, name:p.name, qty:1, unitPrice:p.salePrice}); }
    P.search='';
    render();
  },
  pedidoQtyInc(t){ const P=state.ui.pedido; const item=P.cart.find(i=>i.productId===t.dataset.id); if(item) item.qty++; render(); },
  pedidoQtyDec(t){ const P=state.ui.pedido; const item=P.cart.find(i=>i.productId===t.dataset.id); if(item && item.qty>1) item.qty--; render(); },
  pedidoRemoveFromCart(t){ const P=state.ui.pedido; P.cart = P.cart.filter(i=>i.productId!==t.dataset.id); render(); },
  cancelEditPedido(){ state.ui.pedido = emptyPedido(); render(); },
  savePedido(t){
    const P = state.ui.pedido;
    const status = t.dataset.status;
    if(P.cart.length===0){ notify.err('Adicione ao menos um produto ao pedido.'); return; }
    const subtotal = P.cart.reduce((a,i)=>a+i.qty*i.unitPrice,0);
    const discount = +computeDiscountAmount(subtotal, P.discount, P.discountType).toFixed(2);
    const shipping = Math.max(0, parseFloat(P.shipping)||0);
    const total = Math.max(0, subtotal - discount + shipping);
    const customer = state.customers.find(c=>c.id===P.customerId);
    const items = P.cart.map(i=>({productId:i.productId, name:i.name, qty:i.qty, unitPrice:Math.max(0,+i.unitPrice||0), subtotal:+(i.qty*(Math.max(0,+i.unitPrice||0))).toFixed(2)}));

    if(P.id){
      state.orders = state.orders.map(o=> o.id===P.id ? {
        ...o, customerId:P.customerId||null, customerName: customer? customer.name : 'Consumidor Final',
        items, subtotal:+subtotal.toFixed(2), discount:+discount.toFixed(2), shipping:+shipping.toFixed(2), total:+total.toFixed(2),
        notes:P.notes||'', expectedDate:P.expectedDate||'', status, updatedAt:new Date().toISOString()
      } : o);
      notify.ok('Pedido '+P.orderNumber+' atualizado.');
    } else {
      const orderNumber = nextOrderNumber();
      const order = {
        id:uid('pedido'), orderNumber, createdAt:new Date().toISOString(), createdBy: state.currentUser? state.currentUser.name : '',
        customerId:P.customerId||null, customerName: customer? customer.name : 'Consumidor Final',
        items, subtotal:+subtotal.toFixed(2), discount:+discount.toFixed(2), shipping:+shipping.toFixed(2), total:+total.toFixed(2),
        notes:P.notes||'', expectedDate:P.expectedDate||'', status, saleId:null
      };
      state.orders.unshift(order);
      notify.ok('Pedido '+orderNumber+' salvo como '+status.toLowerCase()+'.');
    }
    persist('orders');
    state.ui.pedido = emptyPedido();
    state.ui.pedidoView = 'lista';
    render();
  },
  setPedidoDiscountType(t){ state.ui.pedido.discountType = t.dataset.type; render(); },
  editPedido(t){
    const o = state.orders.find(x=>x.id===t.dataset.id);
    if(!o) return;
    state.ui.pedido = {
      id:o.id, orderNumber:o.orderNumber, customerId:o.customerId||'', search:'',
      cart: o.items.map(i=>({productId:i.productId, name:i.name, qty:i.qty, unitPrice:i.unitPrice})),
      discount:o.discount||0, discountType:'value', shipping:o.shipping||0, expectedDate:o.expectedDate||'', notes:o.notes||''
    };
    state.ui.pedidoView = 'nova';
    render();
  },
  filterOrderStatus(t){ state.ui.orderStatusFilter = t.dataset.status||''; state.ui.orderMonth = false; render(); },
  kpiOrders(t){ state.ui.orderStatusFilter = t.dataset.status||''; state.ui.orderMonth = !!t.dataset.month; state.ui.orderQuery = ''; state.ui.pedidoView = 'lista'; render(); setTimeout(()=>{ const el=document.querySelector('.table-wrap'); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); },30); },
  viewOrder(t){ state.ui.orderDetail = state.orders.find(o=>o.id===t.dataset.id); render(); },
  closeOrderDetail(){ state.ui.orderDetail=null; render(); },
  invoiceOrder(t){
    const order = state.orders.find(o=>o.id===t.dataset.id);
    if(!order) return;
    // check stock availability before invoicing
    const shortages = [];
    order.items.forEach(i=>{
      const p = state.products.find(x=>x.id===i.productId);
      if(!p){ shortages.push(i.name+' (produto não existe mais)'); }
      else if(p.stock<i.qty){ shortages.push(i.name+' (estoque atual: '+p.stock+', pedido: '+i.qty+')'); }
    });
    if(shortages.length && !confirm('Estoque insuficiente para faturar integralmente este pedido:\n\n'+shortages.join('\n')+'\n\nContinuar mesmo assim? O estoque pode ficar negativo para esses itens.')) return;
    state.ui.orderDetail = null;
    state.ui.modal = { type:'invoiceOrder', orderId:order.id, payments:[{method:'Dinheiro', amount:String(order.total)}] };
    render();
  },
  addInvoicePayment(){ state.ui.modal.payments.push({method:'Dinheiro', amount:''}); render(); },
  removeInvoicePayment(t){ state.ui.modal.payments.splice(parseInt(t.dataset.idx),1); render(); },
  confirmInvoiceOrder(){
    const m = state.ui.modal;
    const order = state.orders.find(o=>o.id===m.orderId);
    if(!order){ notify.err('Pedido não encontrado.'); state.ui.modal=null; render(); return; }
    const paid = m.payments.reduce((a,p)=>a+Math.max(0, parseFloat(p.amount)||0),0);
    if(Math.abs(+(order.total-paid).toFixed(2))>0.009){ notify.err('O valor informado precisa ser igual ao total do pedido ('+brl(order.total)+').'); return; }
    const sale = {
      id:uid('venda'), date:new Date().toISOString(), customerId:order.customerId||null, customerName:order.customerName,
      items: order.items.map(i=>({productId:i.productId,name:i.name,qty:i.qty,unitPrice:i.unitPrice,subtotal:i.subtotal})),
      subtotal:order.subtotal, discount:order.discount, total:order.total,
      payments: m.payments.filter(p=>parseFloat(p.amount)>0).map(p=>({method:p.method, amount:+parseFloat(p.amount).toFixed(2)})),
      status:'concluida', orderId:order.id
    };
    state.sales.unshift(sale); persist('sales');
    state.products = state.products.map(p=>{
      const item = order.items.find(i=>i.productId===p.id);
      return item ? {...p, stock: Math.max(0, p.stock-item.qty)} : p;
    });
    persist('products');
    state.orders = state.orders.map(o=> o.id===order.id ? {...o, status:'Faturado', saleId:sale.id, invoicedAt:new Date().toISOString()} : o);
    persist('orders');
    state.ui.modal = null;
    render();
    notify.ok('Pedido '+order.orderNumber+' faturado com sucesso.');
  },
  cancelOrder(t){
    const order = state.orders.find(o=>o.id===t.dataset.id);
    if(!order) return;
    if(!confirm('Cancelar o pedido '+order.orderNumber+'?')) return;
    state.orders = state.orders.map(o=> o.id===order.id ? {...o, status:'Cancelado'} : o);
    persist('orders');
    if(state.ui.orderDetail && state.ui.orderDetail.id===order.id){ state.ui.orderDetail = state.orders.find(o=>o.id===order.id); }
    render();
    notify.ok('Pedido cancelado.');
  },
  printOrder(t){ printOrderDoc(t.dataset.id); },
  editPedidoFromDetail(t){
    state.ui.orderDetail = null;
    actions.editPedido(t);
  }
};

function printOrderDoc(orderId){
  const o = state.orders.find(x=>x.id===orderId);
  if(!o){ notify.err('Pedido não encontrado.'); return; }
  const w = window.open('', '_blank', 'width=480,height=700');
  if(!w){ notify.err('O navegador bloqueou a janela de impressão. Libere os pop-ups para este site.'); return; }
  const rows = o.items.map(i=>`<tr><td>${esc(i.name)}</td><td style="text-align:center;">${i.qty}</td><td style="text-align:right;">${brl(i.unitPrice)}</td><td style="text-align:right;">${brl(i.subtotal)}</td></tr>`).join('');
  w.document.write(`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>${esc(o.orderNumber)}</title>
  <style>
    body{font-family:Georgia,serif;font-size:13px;color:#241A22;max-width:640px;margin:24px auto;padding:0 20px;}
    h1{font-size:20px;margin:0;color:#3A1E30;}
    .sub{color:#8A7560;font-size:12px;margin-bottom:18px;}
    table{width:100%;border-collapse:collapse;margin:16px 0;}
    th{text-align:left;font-size:11px;text-transform:uppercase;color:#8A7560;border-bottom:2px solid #E9DFCF;padding:6px 4px;}
    td{padding:7px 4px;border-bottom:1px solid #E9DFCF;}
    .tot{display:flex;justify-content:flex-end;gap:20px;font-size:13px;margin:4px 0;}
    .grand{font-size:17px;font-weight:bold;color:#3A1E30;}
    .status{display:inline-block;padding:3px 10px;border-radius:10px;background:#F2E9DA;font-size:11px;margin-left:8px;}
    .foot{margin-top:28px;font-size:11px;color:#8A7560;text-align:center;}
  </style></head><body>
    <h1>Essência — Pedido de Venda</h1>
    <div class="sub">${esc(o.orderNumber)}<span class="status">${esc(o.status)}</span></div>
    <p><b>Cliente:</b> ${esc(o.customerName)}<br>
    <b>Data do pedido:</b> ${fmtDate(o.createdAt)}${o.expectedDate? '<br><b>Previsão de entrega:</b> '+new Date(o.expectedDate+'T00:00:00').toLocaleDateString('pt-BR') : ''}</p>
    ${o.notes? `<p><b>Observações:</b> ${esc(o.notes)}</p>`:''}
    <table>
      <thead><tr><th>Produto</th><th style="text-align:center;">Qtd</th><th style="text-align:right;">Unit.</th><th style="text-align:right;">Subtotal</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="tot"><span>Subtotal</span><span>${brl(o.subtotal)}</span></div>
    <div class="tot"><span>Desconto</span><span>${brl(o.discount)}</span></div>
    <div class="tot"><span>Frete</span><span>${brl(o.shipping||0)}</span></div>
    <div class="tot grand"><span>Total</span><span>${brl(o.total)}</span></div>
    <div class="foot">Documento gerado pelo sistema Essência — não é uma nota fiscal.</div>
  </body></html>`);
  w.document.close();
  setTimeout(()=>{ try{ w.focus(); w.print(); }catch(e){} }, 300);
}

function renderCatalogoCard(p){
  const inactive = p.active===false;
  return `
      <div class="prod-card${inactive?' inactive':''}">

          ${p.image? `<img src="${p.image}" alt="${esc(p.name)}">` : `<span style="font-size:26px;opacity:.4;">${icon('image')}</span>`}

/* ================= caixa ================= */
function caixaRangeKey(from,to){
  const t = todayISO();
  if(from===t && to===t) return 'hoje';
  if(from===daysAgoISO(6) && to===t) return '7d';
  if(from===t.slice(0,8)+'01' && to===t) return 'mes';
  return '';
}
function renderCaixa(){
  const from = state.ui.caixaFrom, to = state.ui.caixaTo;
  const inRange = s=> localDay(s.date)>=from && localDay(s.date)<=to;
  const filtered = state.sales.filter(s=> s.status!=='cancelada' && inRange(s));
  const canceled = state.sales.filter(s=> s.status==='cancelada' && inRange(s)).length;
  const byMethod = {}; PAYMENT_METHODS.forEach(m=>byMethod[m]=0);
  filtered.forEach(s=> s.payments.forEach(p=>{ byMethod[p.method]=(byMethod[p.method]||0)+p.amount; }));
  const methods = Object.keys(byMethod);
  const grandTotal = methods.reduce((a,m)=>a+byMethod[m],0);
  const fiado = byMethod['Fiado']||0;
  const received = grandTotal - fiado;
  const mFilter = state.ui.caixaMethod || '';
  const rows = [];
  filtered.forEach(s=> s.payments.forEach(p=> rows.push({date:s.date, customer:s.customerName, method:p.method, amount:p.amount})));
  rows.sort((a,b)=> new Date(b.date)-new Date(a.date));
  const shown = mFilter ? rows.filter(r=>r.method===mFilter) : rows;
  const shownTotal = shown.reduce((a,r)=>a+r.amount,0);
  const rk = caixaRangeKey(from,to);
  const quick = [['hoje','Hoje'],['7d','7 dias'],['mes','Este mês']];

  return `
  <div class="mb2">
    <h2 class="serif plum" style="font-size:26px;margin-bottom:2px;">Caixa</h2>
    <p class="muted">Entradas por forma de pagamento</p>
  </div>
  <div class="flex gap flex-wrap mb2" style="align-items:end;">
    <div class="segbar">
      ${quick.map(([k,l])=>`<button class="${rk===k?'on':''}" data-action="setCaixaRange" data-range="${k}">${l}</button>`).join('')}
    </div>
    <label class="field" style="margin-bottom:0;"><span class="lbl">De</span><input type="date" data-field="ui.caixaFrom" value="${from}"></label>
    <label class="field" style="margin-bottom:0;"><span class="lbl">Até</span><input type="date" data-field="ui.caixaTo" value="${to}"></label>
  </div>
  <div class="banner-plum mb2" style="flex-wrap:wrap;gap:14px;">
    <div>
      <div style="color:#D8C7E0;font-size:13px;">Recebido no período</div>
      <div class="serif" style="font-size:28px;color:var(--gold-soft);line-height:1.2;">${brl(received)}</div>
    </div>
    <div style="text-align:right;font-size:13px;color:#D8C7E0;line-height:1.7;">
      ${filtered.length} venda(s) · Total vendido <b style="color:#fff;">${brl(grandTotal)}</b><br>
      A receber (fiado) <b style="color:var(--gold-soft);">${brl(fiado)}</b>${canceled? `<br>${canceled} cancelada(s) fora do total`:''}
    </div>
  </div>
  <div class="filterbar-label" style="margin-bottom:6px;">Por forma de pagamento <span style="text-transform:none;letter-spacing:0;font-weight:400;">· toque para filtrar a lista</span></div>
  <div class="grid mb3" style="grid-template-columns:repeat(auto-fit,minmax(118px,1fr));">
    ${methods.map(m=>{ const pct = grandTotal>0 ? Math.round(byMethod[m]/grandTotal*100) : 0; const on = mFilter===m;
      return `<div class="card" role="button" tabindex="0" data-action="filterCaixaMethod" data-method="${esc(m)}" style="padding:12px;cursor:pointer;${on?'border-color:var(--plum);box-shadow:3px 3px 0 var(--plum);':''}${byMethod[m]===0&&!on?'opacity:.6;':''}">
        <div class="muted" style="font-size:11px;margin-bottom:4px;">${m}</div>
        <div class="serif" style="font-size:17px;color:var(--plum);">${brl(byMethod[m])}</div>
        <div style="height:4px;background:var(--tint);border-radius:3px;margin-top:8px;overflow:hidden;"><div style="height:100%;width:${pct}%;background:var(--gold);"></div></div>
        <div class="muted2" style="font-size:11px;margin-top:3px;">${pct}% do total</div>
      </div>`; }).join('')}
  </div>
  <div class="flex-between flex-wrap" style="margin-bottom:8px;">
    <h3 class="serif plum" style="font-size:18px;margin:0;">Movimentações${mFilter? ' · '+esc(mFilter):''}</h3>
    ${mFilter? `<button class="btn btn-ghost" data-action="filterCaixaMethod" data-method="">Mostrar todas as formas</button>`:''}
  </div>
  ${shown.length===0 ? emptyState(icon('wallet',26),'Sem movimentações','Nenhum pagamento registrado nesse período.') : `
  <div class="table-wrap"><table>
    <thead><tr><th>Data</th><th>Cliente</th><th>Forma</th><th style="text-align:right;">Valor</th></tr></thead>
    <tbody>${shown.map(r=>`
      <tr><td class="muted" style="white-space:nowrap;">${fmtDate(r.date)}</td><td>${esc(r.customer)}</td><td>${r.method}${r.method==='Fiado'?' <span class="badge-danger" style="margin-left:4px;">a receber</span>':''}</td><td style="text-align:right;white-space:nowrap;">${brl(r.amount)}</td></tr>
    `).join('')}</tbody>
    <tfoot><tr><td colspan="3" style="text-align:right;font-weight:600;padding:10px 12px;">Total listado (${shown.length})</td><td style="text-align:right;font-weight:600;padding:10px 12px;white-space:nowrap;">${brl(shownTotal)}</td></tr></tfoot>
  </table></div>`}
  `;
}

/* ================= relatorios ================= */
function renderRelatorios(){
  const from = state.ui.relFrom, to = state.ui.relTo;
  const filtered = state.sales.filter(s=> s.status!=='cancelada' && localDay(s.date)>=from && localDay(s.date)<=to);
  const productCost = {}; state.products.forEach(p=> productCost[p.id]=p.costPrice);
  let revenue=0, cost=0; const perProduct = {};
  filtered.forEach(s=> s.items.forEach(i=>{
    revenue += i.subtotal;
    const c = (productCost[i.productId]??0)*i.qty; cost += c;
    perProduct[i.name] = perProduct[i.name] || {qty:0,revenue:0,cost:0,sku:(state.products.find(p=>p.id===i.productId)||{}).sku||''};
    perProduct[i.name].qty += i.qty; perProduct[i.name].revenue += i.subtotal; perProduct[i.name].cost += c;
  }));
  const discountTotal = filtered.reduce((a,s)=>a+s.discount,0);
  const profit = revenue-cost-discountTotal;
  const margin = revenue>0 ? (profit/revenue)*100 : 0;
  const topProducts = Object.entries(perProduct).sort((a,b)=>b[1].qty-a[1].qty).slice(0,8);
  const lowStock = state.products.filter(p=>p.stock<=(p.minStock||0));
  const stockValueCost = state.products.reduce((a,p)=>a+p.stock*p.costPrice,0);
  const stockValueSale = state.products.reduce((a,p)=>a+p.stock*p.salePrice,0);

  return `
  <h2 class="serif plum" style="font-size:26px;margin-bottom:2px;">Relatórios</h2>
  <p class="muted mb2">Lucratividade, vendas e estoque</p>
  <div class="flex gap flex-wrap mb3" style="align-items:end;">
    <label class="field" style="margin-bottom:0;"><span class="lbl">De</span><input type="date" data-field="ui.relFrom" value="${from}"></label>
    <label class="field" style="margin-bottom:0;"><span class="lbl">Até</span><input type="date" data-field="ui.relTo" value="${to}"></label>
    <button class="btn btn-gold" data-action="printRelatorio">${icon('printer')} Imprimir relatório</button>
  </div>
  <h3 class="serif plum" style="font-size:18px;margin-bottom:12px;">Lucratividade</h3>
  <div class="grid" style="grid-template-columns:repeat(4,1fr);" class="mb3">
    <div class="card"><div class="muted" style="font-size:12px;margin-bottom:4px;">Receita</div><div class="serif" style="font-size:20px;color:var(--plum);">${brl(revenue)}</div></div>
    <div class="card"><div class="muted" style="font-size:12px;margin-bottom:4px;">Custo</div><div class="serif" style="font-size:20px;color:var(--plum);">${brl(cost)}</div></div>
    <div class="card"><div class="muted" style="font-size:12px;margin-bottom:4px;">Lucro líquido</div><div class="serif" style="font-size:20px;" class="${profit>=0?'ok-c':'danger-c'}">${brl(profit)}</div></div>
    <div class="card"><div class="muted" style="font-size:12px;margin-bottom:4px;">Margem</div><div class="serif" style="font-size:20px;color:var(--plum);">${margin.toFixed(1)}%</div></div>
  </div>
  <h3 class="serif plum" style="font-size:18px;margin-bottom:12px;">Vendas por produto</h3>
  <div class="table-wrap mb3">
    ${topProducts.length===0 ? `<div style="padding:24px;text-align:center;color:var(--muted2);font-size:14px;">Sem vendas no período selecionado.</div>` : `
    <table>
      <thead><tr><th>Cód.</th><th>Produto</th><th style="text-align:right;">Qtd. vendida</th><th style="text-align:right;">Receita</th><th style="text-align:right;">Lucro</th></tr></thead>
      <tbody>${topProducts.map(([name,v])=>`
        <tr><td class="muted">${esc(v.sku||'')}</td><td>${esc(name)}</td><td style="text-align:right;">${v.qty}</td><td style="text-align:right;">${brl(v.revenue)}</td><td style="text-align:right;">${brl(v.revenue-v.cost)}</td></tr>
      `).join('')}</tbody>
    </table>`}
  </div>
  <h3 class="serif plum" style="font-size:18px;margin-bottom:12px;">Estoque</h3>
  <div class="grid grid-3 mb2">
    <div class="card"><div class="muted" style="font-size:12px;margin-bottom:4px;">Valor do estoque (custo)</div><div class="serif" style="font-size:20px;color:var(--plum);">${brl(stockValueCost)}</div></div>
    <div class="card"><div class="muted" style="font-size:12px;margin-bottom:4px;">Valor do estoque (venda)</div><div class="serif" style="font-size:20px;color:var(--plum);">${brl(stockValueSale)}</div></div>
    <div class="card"><div class="muted" style="font-size:12px;margin-bottom:4px;">Produtos em alerta</div><div class="serif" style="font-size:20px;" class="${lowStock.length?'danger-c':'plum'}">${lowStock.length}</div></div>
  </div>
  ${lowStock.length>0? `
  <div class="table-wrap" style="padding:0 16px;">
    ${lowStock.map(p=>`
      <div class="flex-between" style="padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;">
        <span>${pcode(p)} ${esc(p.name)}</span><span class="danger-c">${p.stock} un. (mín. ${p.minStock||0})</span>
      </div>`).join('')}
  </div>`:''}
  `;
}

function syncStatus(){
  if(!syncEnabled()) return {cls:'off', label:'Desligada', text:'Desligada'};
  if(SYNC.busy) return {cls:'busy', label:'Sincronizando...', text:'Sincronizando...'};
  if(SYNC.conflict) return {cls:'err', label:'Conflito: resolva no menu Servidor', text:'Conflito de versões'};
  if(SYNC.msgType==='err' && SYNC.msg) return {cls:'err', label:'Sem conexão com o servidor', text:'Sem conexão'};
  if(SYNC.cfg.dirty) return {cls:'warn', label:'Alterações aguardando envio', text:'Alterações pendentes'};
  return {cls:'ok', label:'Em dia com o servidor', text:'Em dia'};
}
function renderServidor(){
  const view = state.ui.servidorSubView || 'conexao';
  const st = syncStatus();
  const last = SYNC.cfg.last ? new Date(SYNC.cfg.last).toLocaleString('pt-BR') : 'nunca';
  const tabs = [['conexao','Conexão'],['dados','Enviar e baixar'],['backup','Backup'],['guia','Guia de instalação']];
  return `
  <div class="mb2">
    <h2 class="serif plum" style="font-size:26px;margin-bottom:2px;">Servidor</h2>
    <p class="muted">Sincronização com o banco de dados do seu site (Hostinger)</p>
  </div>
  <div class="servstatus ${st.cls}">
    <span class="syncdot ${st.cls}"></span>
    <div style="flex:1;min-width:180px;"><b>${esc(st.text)}</b>
      <div style="font-size:12.5px;" class="muted">Versão no servidor: ${SYNC.cfg.version} · Última sincronização: ${last}</div></div>
    ${syncEnabled() ? `<button class="btn btn-ghost" data-action="syncTest" ${SYNC.busy?'disabled':''}>Testar conexão</button>` : ''}
  </div>
  <div class="segbar mb2">
    ${tabs.map(([id,l])=>`<button class="${view===id?'on':''}" data-action="setServidorSubView" data-view="${id}">${l}</button>`).join('')}
  </div>
  ${SYNC.msg ? `<p class="${SYNC.msgType==='err'?'danger-c':'muted'}" style="font-size:13px;margin-bottom:14px;max-width:640px;">${esc(SYNC.msg)}</p>` : ''}
  ${view==='dados' ? renderServidorDados() : view==='backup' ? renderServidorBackup() : view==='guia' ? renderServidorGuia() : renderServidorConexao()}
  `;
}

function renderServidorDados(){

  const counts = [['Produtos',state.products.length],['Clientes',state.customers.length],['Vendas',state.sales.length],['Pedidos',state.orders.length],['Usuários',state.users.length]];
  return `
  <div class="card" style="padding:18px;max-width:720px;margin-bottom:16px;">

const actions_usuarios = {
  async syncConnect(){
    const key = String(state.ui.syncKey!==undefined?state.ui.syncKey:SYNC.cfg.key).trim();
    if(!key){ notify.err('Informe a senha de sincronização.'); return; }
    if(state.ui.syncAuto!==undefined) SYNC.cfg.auto = !!state.ui.syncAuto;
    const changed = key !== SYNC.cfg.key;
    SYNC.cfg.key = key; if(changed){ SYNC.cfg.version = 0; SYNC.cfg.dirty = false; }
    syncSaveCfg();
    SYNC.busy = true; render();
    try{
      const j = await syncCall('ping');
      SYNC.busy = false;
      if(j.empty){
        syncSetMsg('Conectado. O servidor está vazio — enviando os dados deste navegador...', 'ok');
        await syncPush(false, false);
      } else if(j.version === SYNC.cfg.version && !SYNC.cfg.dirty){
        syncSetMsg('Conectado. Tudo em dia.', 'ok'); notify.ok('Conectado ao servidor.');
      } else {
        SYNC.conflict = true;
        syncSetMsg('Conectado. O servidor já tem dados. Escolha "Baixar do servidor" para usar os dados de lá, ou "Sobrescrever servidor" para substituí-los pelos deste navegador.', 'err');
      }
    }catch(e){
      SYNC.busy = false;
      if(e.code==='bad_key'){ SYNC.cfg.key = ''; syncSaveCfg(); }
      syncSetMsg(e.message, 'err'); notify.err(e.message);
    }
    render();
  },
  setServidorSubView(t){ state.ui.servidorSubView = t.dataset.view; render(); },
  async syncTest(){
    if(SYNC.busy) return;
    SYNC.busy = true; render();
    try{
      const j = await syncCall('ping');
      syncSetMsg('Conexão ok. Versão do servidor: '+j.version+(j.empty?' (servidor vazio)':'')+'.', 'ok');
    }catch(e){ syncSetMsg(e.message, 'err'); }
    SYNC.busy = false; render();
  },
  syncPushNow(){ syncPush(false, false); },
  syncPullNow(){
    if(SYNC.cfg.dirty && !confirm('Há alterações deste navegador ainda não enviadas. Baixar do servidor vai descartá-las. Continuar?')) return;
    syncPull(false);
  },
  syncForcePush(){
    if(!confirm('Isto substitui TODOS os dados do servidor pelos deste navegador. Continuar?')) return;
    syncPush(true, false);
  },
  syncDisconnect(){
    if(!confirm('Desconectar do servidor? Os dados continuam salvos neste navegador e no servidor.')) return;
    SYNC.cfg = {key:'', user:'', hash:'', auto:true, version:0, dirty:false, last:''}; SYNC.conflict=false; SYNC.msg='';
    state.ui.syncKey = undefined; state.ui.syncAuto = undefined;
    syncSaveCfg(); render();
  },
  newUsuario(){ state.ui.modal = {type:'newUser', name:'', username:'', role:'user', password:'', confirm:'', error:''}; render(); },
  submitNewUser(){
    const m = state.ui.modal;
    m.error='';
    if(!m.name.trim() || !m.username.trim() || !m.password){ m.error='Preencha todos os campos.'; render(); return; }
    if(/\s/.test(m.username.trim())){ m.error='O usuário não pode conter espaços.'; render(); return; }
    if(m.password.length<4){ m.error='A senha deve ter ao menos 4 caracteres.'; render(); return; }
    if(m.password!==m.confirm){ m.error='As senhas não conferem.'; m.confirm=''; render(); return; }
    if(state.users.some(u=>u.username.toLowerCase()===m.username.trim().toLowerCase())){ m.error='Esse usuário já existe.'; render(); return; }
    const newUser = { id:uid('user'), name:m.name.trim(), username:m.username.trim(), passwordHash: simpleHash(m.password), createdAt:new Date().toISOString(), role: m.role==='admin'?'admin':'user' };
    state.users.push(newUser); persist('users');
    state.ui.modal = null; render();
  },
  editUserName(t){ const u = state.users.find(x=>x.id===t.dataset.id); state.ui.modal = {type:'editUser', data:{id:u.id,name:u.name,role:roleOf(u)}}; render(); },
  openMyPassword(){ const u = state.currentUser; state.ui.modal = {type:'resetPw', userId:u.id, userName:u.name, self:true, cur:'', pw:'', pw2:''}; render(); },
  openResetPw(t){ const u = state.users.find(x=>x.id===t.dataset.id); state.ui.modal = {type:'resetPw', userId:u.id, userName:u.name, pw:'', pw2:''}; render(); },
  deleteUser(t){
    if(t.dataset.id===state.currentUser.id){ notify.err('Você não pode excluir a própria conta enquanto está conectado.'); return; }
    const target = state.users.find(u=>u.id===t.dataset.id);
    if(target && roleOf(target)==='admin' && adminCount()<=1){ notify.err('Precisa existir ao menos um administrador.'); return; }
    if(!confirm('Excluir este usuário?')) return;
    state.users = state.users.filter(u=>u.id!==t.dataset.id); persist('users'); render();
  },
  submitEditUser(){
    const d = state.ui.modal.data;
    if(!d.name || !d.name.trim()){ notify.err('Informe o nome.'); return; }
    const cur = state.users.find(u=>u.id===d.id); const newRole = d.role==='user' ? 'user' : 'admin';
    if(cur && roleOf(cur)==='admin' && newRole==='user' && adminCount()<=1){ notify.err('Precisa existir ao menos um administrador.'); return; }
    state.users = state.users.map(u=> u.id===d.id ? {...u, name:d.name.trim(), role:newRole} : u); persist('users');
    if(state.currentUser && state.currentUser.id===d.id) state.currentUser = state.users.find(u=>u.id===d.id);
    state.ui.modal=null; render();
  },
  submitResetPw(){
    const m = state.ui.modal;
    if(m.userId!==state.currentUser.id && !isAdmin()){ notify.err('Somente administradores podem redefinir a senha de outros usuários.'); return; }
    if(m.self){
      const me = state.users.find(u=>u.id===state.currentUser.id);
      if(!me || simpleHash(m.cur||'')!==me.passwordHash){ notify.err('A senha atual não confere.'); return; }
    }
    if(!m.pw || m.pw.length<4){ notify.err('A senha deve ter ao menos 4 caracteres.'); return; }
    if(m.pw!==m.pw2){ notify.err('As senhas não conferem.'); return; }
    state.users = state.users.map(u=> u.id===m.userId? {...u, passwordHash: simpleHash(m.pw)} : u); persist('users');
    if(state.currentUser && state.currentUser.id===m.userId) state.currentUser = state.users.find(u=>u.id===m.userId);
    if(state.currentUser) sessionSave(state.currentUser, state.tab);
    state.ui.modal=null; render(); notify.ok('Senha alterada.');
  },
  async exportBackup(){
    const backup = { customers: state.customers, products: state.products, sales: state.sales, orders: state.orders, users: state.users, categories: state.categories, subcategories: state.subcategories, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(backup,null,2)], {type:'application/json'});
    await saveFile('essencia-backup-'+todayISO()+'.json', blob);
  },
  async exportDataSQL(){
    const totalRecords = state.customers.length+state.products.length+state.sales.length+state.orders.length+state.users.length+state.categories.length+state.subcategories.length;
    if(!totalRecords){ notify.err('Não há dados cadastrados para exportar ainda.'); return; }
    const sql = buildDataSQL();
    const blob = new Blob([sql], {type:'application/sql;charset=utf-8;'});
    await saveFile('essencia-dados-'+todayISO()+'.sql', blob);
    notify.ok('Arquivo SQL gerado. Importe no phpMyAdmin do seu banco da Hostinger, depois do schema.sql.');
  }
};

window.importBackupFile = function(input){
  const file = input.files[0];
  if(!file) return;
  if(!confirm('Importar este backup vai substituir todos os dados atuais. Continuar?')) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const data = JSON.parse(e.target.result);
      state.customers = data.customers||[]; persist('customers');
      state.products = data.products||[]; persist('products');
      state.sales = data.sales||[]; persist('sales');
      state.users = data.users||[]; persist('users');
      state.categories = (data.categories && data.categories.length) ? data.categories : loadInitialCategories(); persist('categories');
      state.subcategories = data.subcategories||[]; persist('subcategories');
      state.orders = data.orders||[]; persist('orders');
      notify.ok('Backup importado com sucesso.');
      render();
    }catch(err){ notify.err('Arquivo de backup inválido.'); }
  };
  reader.readAsText(file);
};

  const w = window.open('', '_blank', 'width=380,height=640');

    <div>Venda: ${s.id.slice(-8).toUpperCase()}</div>
    <div>Data: ${fmtDate(s.date)}</div>
    <div>Cliente: ${esc(s.customerName)}</div>
    <hr>
    <table>
      <tr><td><b>Item</b></td><td style="text-align:center;"><b>Qtd</b></td><td style="text-align:right;"><b>Valor</b></td></tr>
      ${rows}
    </table>
    <hr>
    <div class="tot"><span>Subtotal</span><span>${brl(s.subtotal)}</span></div>
    <div class="tot"><span>Desconto</span><span>${brl(s.discount)}</span></div>

    <div class="foot">Obrigado pela preferencia!<br>Volte sempre.</div>
  </body></html>`);
  w.document.close();
  setTimeout(()=>{ try{ w.focus(); w.print(); }catch(e){} }, 300);
}

function renderInvoiceOrderModal(m){
  const order = state.orders.find(o=>o.id===m.orderId);
  if(!order) return modalWrap('Faturar pedido', '<p class="muted">Pedido não encontrado.</p>');
  const paid = m.payments.reduce((a,p)=>a+Math.max(0, parseFloat(p.amount)||0),0);
  const diff = +(order.total-paid).toFixed(2);
  const body = `
    <p class="muted" style="font-size:13px;margin-bottom:14px;">Faturando <b style="color:var(--ink);">${esc(order.orderNumber)}</b> · ${esc(order.customerName)}</p>
    <div class="flex-between serif" style="font-size:20px;margin-bottom:16px;color:var(--plum);"><span>Total a receber</span><span>${brl(order.total)}</span></div>
    <div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-bottom:8px;">Como foi pago</div>
    ${m.payments.map((p,idx)=>`
      <div class="flex gap mb1">
        <select style="flex:1.3;" data-field="ui.modal.payments.${idx}.method">
          ${PAYMENT_METHODS.map(pm=>`<option value="${pm}" ${p.method===pm?'selected':''}>${pm}</option>`).join('')}
        </select>
        <input type="number" step="0.01" min="0" placeholder="valor" style="flex:1;" data-field="ui.modal.payments.${idx}.amount" value="${esc(p.amount)}">
        ${m.payments.length>1? `<button class="icon-btn danger-c" data-action="removeInvoicePayment" data-idx="${idx}">${icon('close',14)}</button>`:''}
      </div>`).join('')}
    <button class="btn" style="color:var(--plum);font-size:12px;padding:4px 0;" data-action="addInvoicePayment">+ adicionar forma de pagamento</button>
    <div class="${Math.abs(diff)>0.009?'danger-c':'ok-c'}" style="font-size:12px;margin:12px 0;">
      ${Math.abs(diff)>0.009 ? (diff>0? 'Faltam '+brl(diff) : 'Passou '+brl(-diff))+' para fechar o total' : 'Valor confere com o total do pedido'}
    </div>
    <div class="flex" style="justify-content:flex-end;gap:8px;margin-top:8px;">
      <button class="btn btn-ghost" data-action="closeModal">Cancelar</button>
      <button class="btn btn-gold" data-action="confirmInvoiceOrder">${icon('check')} Confirmar faturamento</button>
    </div>`;
  return modalWrap('Faturar pedido', body);
}

function renderCustomerHistoryModal(m){
  const c = state.customers.find(x=>x.id===m.customerId);
  if(!c) return modalWrap('Cliente', '<p class="muted">Cliente não encontrado.</p>');
  const mySales = state.sales.filter(s=> s.customerId===c.id && s.status!=='cancelada');
  const totalSpent = mySales.reduce((a,s)=>a+s.total,0);
  const avg = mySales.length? totalSpent/mySales.length : 0;
  const last = mySales.length? mySales.map(s=>s.date).sort().slice(-1)[0] : null;
  const prodCount = {};
  mySales.forEach(s=> s.items.forEach(i=>{ prodCount[i.name]=(prodCount[i.name]||0)+i.qty; }));
  const fav = Object.entries(prodCount).sort((a,b)=>b[1]-a[1])[0];
  const body = `
    <div class="grid grid-3 mb2">
      <div class="card kpi" style="padding:13px;"><div class="klabel">Compras</div><div class="kval" style="font-size:20px;">${mySales.length}</div></div>
      <div class="card kpi" style="padding:13px;"><div class="klabel">Total gasto</div><div class="kval" style="font-size:20px;">${brl(totalSpent)}</div></div>
      <div class="card kpi" style="padding:13px;"><div class="klabel">Ticket médio</div><div class="kval" style="font-size:20px;">${brl(avg)}</div></div>
    </div>
    <p style="font-size:13px;" class="muted mb2">
      ${c.phone? 'Telefone: '+esc(c.phone)+' · ' : ''}${c.email? esc(c.email)+' · ' : ''}
      ${last? 'Última compra em '+fmtDate(last) : 'Ainda sem compras registradas'}
      ${fav? ' · Preferido: <b style="color:var(--ink);">'+esc(fav[0])+'</b> ('+fav[1]+' un.)' : ''}
    </p>
    ${mySales.length===0 ? '<p class="muted2" style="font-size:13px;">Este cliente ainda não tem compras registradas.</p>' : `
    <div class="table-wrap">
      <table>
        <thead><tr><th>Data</th><th>Itens</th><th>Pagamento</th><th style="text-align:right;">Total</th></tr></thead>
        <tbody>${mySales.slice().sort((a,b)=> new Date(b.date)-new Date(a.date)).map(s=>`
          <tr><td class="muted" style="white-space:nowrap;">${fmtDate(s.date)}</td>
          <td style="font-size:12.5px;">${esc(s.items.map(i=>i.qty+'x '+i.name).join(', '))}</td>
          <td>${s.payments.map(x=>x.method).join(', ')}</td>
          <td style="text-align:right;">${brl(s.total)}</td></tr>`).join('')}</tbody>
      </table>
    </div>`}
    <div class="flex" style="justify-content:flex-end;gap:8px;margin-top:16px;">
      <button class="btn btn-ghost" data-action="closeModal">Fechar</button>
    </div>`;
  return modalWrap('Histórico · '+esc(c.name), body, true);
}

/* ================= modal ================= */
function renderModal(){
  const m = state.ui.modal;
  if(m.type==='cliente') return renderClienteModal(m.data);
  if(m.type==='produto') return renderProdutoModal(m.data);
  if(m.type==='ajuste') return renderAjusteModal(m);
  if(m.type==='editUser') return renderEditUserModal(m.data);
  if(m.type==='resetPw') return renderResetPwModal(m);
  if(m.type==='import') return renderImportModal(m);
  if(m.type==='bulkImages') return renderBulkImagesModal(m);
  if(m.type==='newUser') return renderNewUserModal(m);
  if(m.type==='customerHistory') return renderCustomerHistoryModal(m);
  if(m.type==='invoiceOrder') return renderInvoiceOrderModal(m);
  if(m.type==='categories') return renderCategoriesModal(m);
  if(m.type==='exportProducts') return renderExportProductsModal(m);
  if(m.type==='fixBg') return renderFixBgModal(m);
  return '';
}

function modalWrap(title, body, wide){
  return `

    <div class="modal-box ${wide?'wide':''}">

      <div class="modal-body">${body}</div>
    </div>
  </div>`;
}

  return `<label class="field"><span class="lbl">Perfil</span>
    <select data-field="${field}" ${disabled?'disabled':''}>

      <option value="admin" ${value==='admin'?'selected':''}>Administrador (acesso total)</option>
    </select>${disabled?'<span class="hint">É o único administrador: não pode virar usuário.</span>':''}</label>`;
}
