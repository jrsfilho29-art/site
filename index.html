            <button class="btn" style="color:var(--plum);font-size:12px;text-decoration:underline;padding:0;margin-right:10px;" data-action="viewSale" data-id="${s.id}">detalhes</button>
            <button class="icon-btn plum" data-action="printReceipt" data-id="${s.id}" title="Imprimir recibo">${icon('printer')}</button>
            ${s.status!=='cancelada'? `<button class="icon-btn danger-c" data-action="cancelSale" data-id="${s.id}">${icon('xcircle')}</button>`:''}
          </td>
        </tr>`).join('')}
    </tbody>
  </table></div>`;
}

const actions_vendas = {
  setVendaView(t){ state.ui.vendaView = t.dataset.view; render(); },
  addToCart(t){
    const p = state.products.find(x=>x.id===t.dataset.id);
    if(!p){ return; }
    if(p.active===false){ notify.err('Este produto está desativado e não pode ser vendido. Reative-o no Catálogo.'); return; }
    if(p.stock<=0){ notify.err('Produto sem estoque disponível.'); return; }
    const V = state.ui.venda;
    const existing = V.cart.find(i=>i.productId===p.id);
    if(existing){
      if(existing.qty+1>p.stock){ notify.err('Quantidade maior que o estoque disponível.'); return; }
      existing.qty++;
    } else {
      V.cart.push({productId:p.id, name:p.name, qty:1, unitPrice:p.salePrice, stock:p.stock});
    }
    V.search='';
    render();
  },
  cartQtyInc(t){
    const V = state.ui.venda; const item = V.cart.find(i=>i.productId===t.dataset.id);
    if(item && item.qty<item.stock) item.qty++;
    render();
  },
  cartQtyDec(t){
    const V = state.ui.venda; const item = V.cart.find(i=>i.productId===t.dataset.id);
    if(item && item.qty>1) item.qty--;
    render();
  },
  removeFromCart(t){
    const V = state.ui.venda; V.cart = V.cart.filter(i=>i.productId!==t.dataset.id); render();
  },
  setDiscountType(t){ state.ui.venda.discountType = t.dataset.type; render(); },
  addPayment(){ state.ui.venda.payments.push({method:'Dinheiro',amount:''}); render(); },
  removePayment(t){ const V = state.ui.venda; V.payments.splice(parseInt(t.dataset.idx),1); render(); },
  finalizarVenda(){
    const V = state.ui.venda;
    if(V.cart.length===0){ notify.err('Adicione ao menos um produto.'); return; }
    const subtotal = V.cart.reduce((a,i)=>a+i.qty*i.unitPrice,0);
    const discount = computeDiscountAmount(subtotal, V.discount, V.discountType);
    const total = Math.max(0, subtotal-discount);
    const paid = V.payments.reduce((a,p)=>a+Math.max(0, parseFloat(p.amount)||0),0);
    if(Math.abs(+(total-paid).toFixed(2))>0.009){ notify.err('O valor pago precisa ser igual ao total da venda.'); return; }
    const customer = state.customers.find(c=>c.id===V.customerId);
    const sale = {
      id:uid('venda'), date:new Date().toISOString(), customerId:V.customerId||null,
      customerName: customer? customer.name : 'Consumidor Final',
      items: V.cart.map(i=>({productId:i.productId,name:i.name,qty:i.qty,unitPrice:i.unitPrice,subtotal:+(i.qty*i.unitPrice).toFixed(2)})),
      subtotal:+subtotal.toFixed(2), discount:+discount.toFixed(2), total:+total.toFixed(2),
      payments: V.payments.filter(p=>parseFloat(p.amount)>0).map(p=>({method:p.method, amount:+parseFloat(p.amount).toFixed(2)})),
      status:'concluida'
    };
    state.sales.unshift(sale); persist('sales');
    state.products = state.products.map(p=>{
      const item = sale.items.find(i=>i.productId===p.id);
      return item ? {...p, stock: Math.max(0, p.stock-item.qty)} : p;
    });
    persist('products');
    state.ui.venda = {customerId:'',search:'',cart:[],discount:0,discountType:'value',payments:[{method:'Dinheiro',amount:''}]};
    state.ui.vendaView='lista';
    render();
  },
  viewSale(t){ state.ui.saleDetail = state.sales.find(s=>s.id===t.dataset.id); render(); },
  cancelSale(t){
    if(!confirm('Cancelar esta venda? O estoque será restaurado.')) return;
    const sale = state.sales.find(s=>s.id===t.dataset.id);
    state.sales = state.sales.map(s=> s.id===sale.id? {...s,status:'cancelada'} : s);
    persist('sales');
    state.products = state.products.map(p=>{
      const item = sale.items.find(i=>i.productId===p.id);
      return item ? {...p, stock:p.stock+item.qty} : p;
    });
    persist('products'); render();
  },
  closeSaleDetail(){ state.ui.saleDetail=null; render(); },
  viewCustomer(t){ state.ui.modal = {type:'customerHistory', customerId:t.dataset.id}; render(); },
  printReceipt(t){ printReceipt(t.dataset.id); },
  async exportSalesCSV(){
    const f=state.ui.relFrom, to=state.ui.relTo;
    const list = state.sales.filter(s=>s.status!=='cancelada' && s.date.slice(0,10)>=f && s.date.slice(0,10)<=to);
    if(!list.length){ notify.err('Nenhuma venda no período selecionado.'); return; }
    const rows=[['Data','Cliente','Produto','Qtd','Preco Unit','Subtotal','Desconto Venda','Total Venda','Pagamento']];
    list.forEach(s=> s.items.forEach(i=> rows.push([
      fmtDate(s.date), s.customerName, i.name, i.qty,
      i.unitPrice.toFixed(2).replace('.',','), i.subtotal.toFixed(2).replace('.',','),
      s.discount.toFixed(2).replace('.',','), s.total.toFixed(2).replace('.',','),
      s.payments.map(x=>x.method).join(' + ')
    ])));
    await downloadCSV('vendas-'+f+'-a-'+to+'.csv', rows);
    notify.ok('Relatório de vendas exportado.');
  },
  async exportStockCSV(){
    if(!state.products.length){ notify.err('Nenhum produto cadastrado.'); return; }
    const rows=[['SKU','Produto','Marca','Categoria','Subgrupo','Volume','Fornecedor','Estoque','Minimo','Maximo','Custo Unit','Venda Unit','Markup %','Valor Custo Total','Valor Venda Total']];
    state.products.forEach(p=> rows.push([
      p.sku||'', p.name, p.brand||'', p.category||'', p.subcategory||'', p.volume||'', p.supplier||'', p.stock, p.minStock||0, p.maxStock!=null?p.maxStock:'',
      (p.costPrice||0).toFixed(2).replace('.',','), (p.salePrice||0).toFixed(2).replace('.',','),
      (p.markup||0).toFixed(2).replace('.',','),
      (p.stock*(p.costPrice||0)).toFixed(2).replace('.',','), (p.stock*(p.salePrice||0)).toFixed(2).replace('.',',')
    ]));
    await downloadCSV('estoque-'+todayISO()+'.csv', rows);
    notify.ok('Relatório de estoque exportado.');
  },
  async exportPurchaseList(){
    const low = state.products.filter(p=>p.stock<=(p.minStock||0));
    if(!low.length){ notify.ok('Nenhum produto precisa de reposição no momento.'); return; }
    const rows=[['SKU','Produto','Marca','Fornecedor','Estoque Atual','Minimo','Sugestao Compra','Custo Unit','Custo Estimado']];
    low.forEach(p=>{
      const sug = Math.max(1, (p.minStock||0)*2 - p.stock);
      rows.push([p.sku||'', p.name, p.brand||'', p.supplier||'', p.stock, p.minStock||0, sug,
        (p.costPrice||0).toFixed(2).replace('.',','), (sug*(p.costPrice||0)).toFixed(2).replace('.',',')]);
    });
    await downloadCSV('lista-de-compras-'+todayISO()+'.csv', rows);
    notify.ok('Lista de compras gerada com '+low.length+' item(ns).');
  }
};

/* ================= pedidos de venda ================= */
const ORDER_STATUSES = ['Rascunho','Pendente','Faturado','Cancelado'];
function orderStatusBadgeClass(status){
  if(status==='Faturado') return 'badge-ok';
  if(status==='Cancelado') return 'badge-danger';
  if(status==='Pendente') return 'badge-warn';
  return 'badge-neutral';
}
function nextOrderNumber(){
  const n = state.orders.length + 1;
  return 'PED-' + String(n).padStart(4,'0');
}
function emptyPedido(){
  return { id:null, orderNumber:'', customerId:'', search:'', cart:[], discount:0, shipping:0, expectedDate:'', notes:'' };
}

function renderPedidos(){
  const pending = state.orders.filter(o=>o.status==='Pendente');
  const pendingValue = pending.reduce((a,o)=>a+o.total,0);
  const now = todayISO().slice(0,7);
  const invoicedThisMonth = state.orders.filter(o=>o.status==='Faturado' && (o.invoicedAt||o.createdAt||'').slice(0,7)===now);
  const invoicedValue = invoicedThisMonth.reduce((a,o)=>a+o.total,0);

  <div class="flex-between flex-wrap mb2"><div>
      <h2 class="serif plum" style="font-size:26px;margin-bottom:2px;">Pedidos de Venda</h2>

      <button class="btn ${state.ui.pedidoView==='nova'?'btn-gold':'btn-ghost'}" data-action="newPedido">${icon('plus')} Novo pedido</button>

    <div class="card kpi"><div class="klabel">Faturados no mês</div><div class="kval" style="font-size:22px;">${invoicedThisMonth.length}</div><div class="muted2" style="font-size:12px;margin-top:4px;">${brl(invoicedValue)}</div></div>

const actions_pedidos = {
  setPedidoView(t){ state.ui.pedidoView = t.dataset.view; render(); },
  newPedido(){ state.ui.pedido = emptyPedido(); state.ui.pedidoView='nova'; render(); },
  pedidoAddToCart(t){
    const p = state.products.find(x=>x.id===t.dataset.id);
    if(!p){ return; }
    if(p.active===false){ notify.err('Este produto está desativado e não pode ser incluído em pedidos.'); return; }
    const P = state.ui.pedido;
    const existing = P.cart.find(i=>i.productId===p.id);
    if(existing){ existing.qty++; }
    else { P.cart.push({productId:p.id, name:p.name, qty:1, unitPrice:p.salePrice}); }
    P.search='';
    render();
  },
  pedidoQtyInc(t){ const P=state.ui.pedido; const item=P.cart.find(i=>i.productId===t.dataset.id); if(item) item.qty++; render(); },
  pedidoQtyDec(t){ const P=state.ui.pedido; const item=P.cart.find(i=>i.productId===t.dataset.id); if(item && item.qty>1) item.qty--; render(); },
  pedidoRemoveFromCart(t){ const P=state.ui.pedido; P.cart = P.cart.filter(i=>i.productId!==t.dataset.id); render(); },
  cancelEditPedido(){ state.ui.pedido = emptyPedido(); render(); },
  savePedido(t){
    const P = state.ui.pedido;
    const status = t.dataset.status;
    if(P.cart.length===0){ notify.err('Adicione ao menos um produto ao pedido.'); return; }
    const subtotal = P.cart.reduce((a,i)=>a+i.qty*i.unitPrice,0);
    const discount = Math.max(0, parseFloat(P.discount)||0);
    const shipping = Math.max(0, parseFloat(P.shipping)||0);
    const total = Math.max(0, subtotal - discount + shipping);
    const customer = state.customers.find(c=>c.id===P.customerId);
    const items = P.cart.map(i=>({productId:i.productId, name:i.name, qty:i.qty, unitPrice:Math.max(0,+i.unitPrice||0), subtotal:+(i.qty*(Math.max(0,+i.unitPrice||0))).toFixed(2)}));

    if(P.id){
      state.orders = state.orders.map(o=> o.id===P.id ? {
        ...o, customerId:P.customerId||null, customerName: customer? customer.name : 'Consumidor Final',
        items, subtotal:+subtotal.toFixed(2), discount:+discount.toFixed(2), shipping:+shipping.toFixed(2), total:+total.toFixed(2),
        notes:P.notes||'', expectedDate:P.expectedDate||'', status, updatedAt:new Date().toISOString()
      } : o);
      notify.ok('Pedido '+P.orderNumber+' atualizado.');
    } else {
      const orderNumber = nextOrderNumber();
      const order = {
        id:uid('pedido'), orderNumber, createdAt:new Date().toISOString(), createdBy: state.currentUser? state.currentUser.name : '',
        customerId:P.customerId||null, customerName: customer? customer.name : 'Consumidor Final',
        items, subtotal:+subtotal.toFixed(2), discount:+discount.toFixed(2), shipping:+shipping.toFixed(2), total:+total.toFixed(2),
        notes:P.notes||'', expectedDate:P.expectedDate||'', status, saleId:null
      };
      state.orders.unshift(order);
      notify.ok('Pedido '+orderNumber+' salvo como '+status.toLowerCase()+'.');
    }
    persist('orders');
    state.ui.pedido = emptyPedido();
    state.ui.pedidoView = 'lista';
    render();
  },
  editPedido(t){
    const o = state.orders.find(x=>x.id===t.dataset.id);
    if(!o) return;
    state.ui.pedido = {
      id:o.id, orderNumber:o.orderNumber, customerId:o.customerId||'', search:'',
      cart: o.items.map(i=>({productId:i.productId, name:i.name, qty:i.qty, unitPrice:i.unitPrice})),
      discount:o.discount||0, shipping:o.shipping||0, expectedDate:o.expectedDate||'', notes:o.notes||''
    };
    state.ui.pedidoView = 'nova';
    render();
  },
  filterOrderStatus(t){ state.ui.orderStatusFilter = t.dataset.status||''; render(); },
  viewOrder(t){ state.ui.orderDetail = state.orders.find(o=>o.id===t.dataset.id); render(); },
  closeOrderDetail(){ state.ui.orderDetail=null; render(); },
  invoiceOrder(t){
    const order = state.orders.find(o=>o.id===t.dataset.id);
    if(!order) return;
    // check stock availability before invoicing
    const shortages = [];
    order.items.forEach(i=>{
      const p = state.products.find(x=>x.id===i.productId);
      if(!p){ shortages.push(i.name+' (produto não existe mais)'); }
      else if(p.stock<i.qty){ shortages.push(i.name+' (estoque atual: '+p.stock+', pedido: '+i.qty+')'); }
    });
    if(shortages.length && !confirm('Estoque insuficiente para faturar integralmente este pedido:\\n\\n'+shortages.join('\\n')+'\\n\\nContinuar mesmo assim? O estoque pode ficar negativo para esses itens.')) return;
    state.ui.orderDetail = null;
    state.ui.modal = { type:'invoiceOrder', orderId:order.id, payments:[{method:'Dinheiro', amount:String(order.total)}] };
    render();
  },
  addInvoicePayment(){ state.ui.modal.payments.push({method:'Dinheiro', amount:''}); render(); },
  removeInvoicePayment(t){ state.ui.modal.payments.splice(parseInt(t.dataset.idx),1); render(); },
  confirmInvoiceOrder(){
    const m = state.ui.modal;
    const order = state.orders.find(o=>o.id===m.orderId);
    if(!order){ notify.err('Pedido não encontrado.'); state.ui.modal=null; render(); return; }
    const paid = m.payments.reduce((a,p)=>a+Math.max(0, parseFloat(p.amount)||0),0);
    if(Math.abs(+(order.total-paid).toFixed(2))>0.009){ notify.err('O valor informado precisa ser igual ao total do pedido ('+brl(order.total)+').'); return; }
    const sale = {
      id:uid('venda'), date:new Date().toISOString(), customerId:order.customerId||null, customerName:order.customerName,
      items: order.items.map(i=>({productId:i.productId,name:i.name,qty:i.qty,unitPrice:i.unitPrice,subtotal:i.subtotal})),
      subtotal:order.subtotal, discount:order.discount, total:order.total,
      payments: m.payments.filter(p=>parseFloat(p.amount)>0).map(p=>({method:p.method, amount:+parseFloat(p.amount).toFixed(2)})),
      status:'concluida', orderId:order.id
    };
    state.sales.unshift(sale); persist('sales');
    state.products = state.products.map(p=>{
      const item = order.items.find(i=>i.productId===p.id);
      return item ? {...p, stock: Math.max(0, p.stock-item.qty)} : p;
    });
    persist('products');
    state.orders = state.orders.map(o=> o.id===order.id ? {...o, status:'Faturado', saleId:sale.id, invoicedAt:new Date().toISOString()} : o);
    persist('orders');
    state.ui.modal = null;
    render();
    notify.ok('Pedido '+order.orderNumber+' faturado com sucesso.');
  },
  cancelOrder(t){
    const order = state.orders.find(o=>o.id===t.dataset.id);
    if(!order) return;
    if(!confirm('Cancelar o pedido '+order.orderNumber+'?')) return;
    state.orders = state.orders.map(o=> o.id===order.id ? {...o, status:'Cancelado'} : o);
    persist('orders');
    if(state.ui.orderDetail && state.ui.orderDetail.id===order.id){ state.ui.orderDetail = state.orders.find(o=>o.id===order.id); }
    render();
    notify.ok('Pedido cancelado.');
  },
  printOrder(t){ printOrderDoc(t.dataset.id); },
  editPedidoFromDetail(t){
    state.ui.orderDetail = null;
    actions.editPedido(t);
  }
};

/* ================= relatorios ================= */
function renderRelatorios(){
  const from = state.ui.relFrom, to = state.ui.relTo;
  const filtered = state.sales.filter(s=> s.status!=='cancelada' && s.date.slice(0,10)>=from && s.date.slice(0,10)<=to);
  const productCost = {}; state.products.forEach(p=> productCost[p.id]=p.costPrice);
  let revenue=0, cost=0; const perProduct = {};
  filtered.forEach(s=> s.items.forEach(i=>{
    revenue += i.subtotal;
    const c = (productCost[i.productId]??0)*i.qty; cost += c;
    perProduct[i.name] = perProduct[i.name] || {qty:0,revenue:0,cost:0};
    perProduct[i.name].qty += i.qty; perProduct[i.name].revenue += i.subtotal; perProduct[i.name].cost += c;
  }));
  const discountTotal = filtered.reduce((a,s)=>a+s.discount,0);
  const profit = revenue-cost-discountTotal;
  const margin = revenue>0 ? (profit/revenue)*100 : 0;
  const topProducts = Object.entries(perProduct).sort((a,b)=>b[1].qty-a[1].qty).slice(0,8);
  const lowStock = state.products.filter(p=>p.stock<=(p.minStock||0));
  const stockValueCost = state.products.reduce((a,p)=>a+p.stock*p.costPrice,0);
  const stockValueSale = state.products.reduce((a,p)=>a+p.stock*p.salePrice,0);

  return `
  <h2 class="serif plum" style="font-size:26px;margin-bottom:2px;">Relatórios</h2>
  <p class="muted mb2">Lucratividade, vendas e estoque</p>
  <div class="flex gap flex-wrap mb3" style="align-items:end;">
    <label class="field" style="margin-bottom:0;"><span class="lbl">De</span><input type="date" data-field="ui.relFrom" value="${from}"></label>
    <label class="field" style="margin-bottom:0;"><span class="lbl">Até</span><input type="date" data-field="ui.relTo" value="${to}"></label>
  </div>
  <h3 class="serif plum" style="font-size:18px;margin-bottom:12px;">Lucratividade</h3>
  <div class="grid" style="grid-template-columns:repeat(4,1fr);" class="mb3">
    <div class="card"><div class="muted" style="font-size:12px;margin-bottom:4px;">Receita</div><div class="serif" style="font-size:20px;color:var(--plum);">${brl(revenue)}</div></div>
    <div class="card"><div class="muted" style="font-size:12px;margin-bottom:4px;">Custo</div><div class="serif" style="font-size:20px;color:var(--plum);">${brl(cost)}</div></div>
    <div class="card"><div class="muted" style="font-size:12px;margin-bottom:4px;">Lucro líquido</div><div class="serif" style="font-size:20px;" class="${profit>=0?'ok-c':'danger-c'}">${brl(profit)}</div></div>
    <div class="card"><div class="muted" style="font-size:12px;margin-bottom:4px;">Margem</div><div class="serif" style="font-size:20px;color:var(--plum);">${margin.toFixed(1)}%</div></div>
  </div>
  <h3 class="serif plum" style="font-size:18px;margin-bottom:12px;">Vendas por produto</h3>
  <div class="table-wrap mb3">
    ${topProducts.length===0 ? `<div style="padding:24px;text-align:center;color:var(--muted2);font-size:14px;">Sem vendas no período selecionado.</div>` : `
    <table>
      <thead><tr><th>Produto</th><th style="text-align:right;">Qtd. vendida</th><th style="text-align:right;">Receita</th><th style="text-align:right;">Lucro</th></tr></thead>
      <tbody>${topProducts.map(([name,v])=>`
        <tr><td>${esc(name)}</td><td style="text-align:right;">${v.qty}</td><td style="text-align:right;">${brl(v.revenue)}</td><td style="text-align:right;">${brl(v.revenue-v.cost)}</td></tr>
      `).join('')}</tbody>
    </table>`}
  </div>
  <h3 class="serif plum" style="font-size:18px;margin-bottom:12px;">Estoque</h3>
  <div class="grid grid-3 mb2">
    <div class="card"><div class="muted" style="font-size:12px;margin-bottom:4px;">Valor do estoque (custo)</div><div class="serif" style="font-size:20px;color:var(--plum);">${brl(stockValueCost)}</div></div>
    <div class="card"><div class="muted" style="font-size:12px;margin-bottom:4px;">Valor do estoque (venda)</div><div class="serif" style="font-size:20px;color:var(--plum);">${brl(stockValueSale)}</div></div>
    <div class="card"><div class="muted" style="font-size:12px;margin-bottom:4px;">Produtos em alerta</div><div class="serif" style="font-size:20px;" class="${lowStock.length?'danger-c':'plum'}">${lowStock.length}</div></div>
  </div>
  ${lowStock.length>0? `
  <div class="table-wrap" style="padding:0 16px;">
    ${lowStock.map(p=>`
      <div class="flex-between" style="padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;">
        <span>${esc(p.name)}</span><span class="danger-c">${p.stock} un. (mín. ${p.minStock||0})</span>
      </div>`).join('')}
  </div>`:''}
  `;
}

function syncStatus(){
  if(!syncEnabled()) return {cls:'off', label:'Desligada', text:'Desligada'};
  if(SYNC.busy) return {cls:'busy', label:'Sincronizando...', text:'Sincronizando...'};
  if(SYNC.conflict) return {cls:'err', label:'Conflito: resolva no menu Servidor', text:'Conflito de versões'};
  if(SYNC.msgType==='err' && SYNC.msg) return {cls:'err', label:'Sem conexão com o servidor', text:'Sem conexão'};
  if(SYNC.cfg.dirty) return {cls:'warn', label:'Alterações aguardando envio', text:'Alterações pendentes'};
  return {cls:'ok', label:'Em dia com o servidor', text:'Em dia'};
}

const actions_usuarios = {
  async syncConnect(){
    const key = String(state.ui.syncKey!==undefined?state.ui.syncKey:SYNC.cfg.key).trim();
    if(!key){ notify.err('Informe a senha de sincronização.'); return; }
    if(state.ui.syncAuto!==undefined) SYNC.cfg.auto = !!state.ui.syncAuto;
    const changed = key !== SYNC.cfg.key;
    SYNC.cfg.key = key; if(changed){ SYNC.cfg.version = 0; SYNC.cfg.dirty = false; }
    syncSaveCfg();
    SYNC.busy = true; render();
    try{
      const j = await syncCall('ping');
      SYNC.busy = false;
      if(j.empty){
        syncSetMsg('Conectado. O servidor está vazio — enviando os dados deste navegador...', 'ok');
        await syncPush(false, false);
      } else if(j.version === SYNC.cfg.version && !SYNC.cfg.dirty){
        syncSetMsg('Conectado. Tudo em dia.', 'ok'); notify.ok('Conectado ao servidor.');
      } else {
        SYNC.conflict = true;
        syncSetMsg('Conectado. O servidor já tem dados. Escolha "Baixar do servidor" para usar os dados de lá, ou "Sobrescrever servidor" para substituí-los pelos deste navegador.', 'err');
      }
    }catch(e){
      SYNC.busy = false;
      if(e.code==='bad_key'){ SYNC.cfg.key = ''; syncSaveCfg(); }
      syncSetMsg(e.message, 'err'); notify.err(e.message);
    }
    render();
  },
  setServidorSubView(t){ state.ui.servidorSubView = t.dataset.view; render(); },
  async syncTest(){
    if(SYNC.busy) return;
    SYNC.busy = true; render();
    try{
      const j = await syncCall('ping');
      syncSetMsg('Conexão ok. Versão do servidor: '+j.version+(j.empty?' (servidor vazio)':'')+'.', 'ok');
    }catch(e){ syncSetMsg(e.message, 'err'); }
    SYNC.busy = false; render();
  },
  syncPushNow(){ syncPush(false, false); },
  syncPullNow(){
    if(SYNC.cfg.dirty && !confirm('Há alterações deste navegador ainda não enviadas. Baixar do servidor vai descartá-las. Continuar?')) return;
    syncPull(false);
  },
  syncForcePush(){
    if(!confirm('Isto substitui TODOS os dados do servidor pelos deste navegador. Continuar?')) return;
    syncPush(true, false);
  },
  syncDisconnect(){
    if(!confirm('Desconectar do servidor? Os dados continuam salvos neste navegador e no servidor.')) return;
    SYNC.cfg = {key:'', auto:true, version:0, dirty:false, last:''}; SYNC.conflict=false; SYNC.msg='';
    state.ui.syncKey = undefined; state.ui.syncAuto = undefined;
    syncSaveCfg(); render();
  },
  newUsuario(){ state.ui.modal = {type:'newUser', name:'', username:'', password:'', confirm:'', error:''}; render(); },
  submitNewUser(){
    const m = state.ui.modal;
    m.error='';
    if(!m.name.trim() || !m.username.trim() || !m.password){ m.error='Preencha todos os campos.'; render(); return; }
    if(/\s/.test(m.username.trim())){ m.error='O usuário não pode conter espaços.'; render(); return; }
    if(m.password.length<4){ m.error='A senha deve ter ao menos 4 caracteres.'; render(); return; }
    if(m.password!==m.confirm){ m.error='As senhas não conferem.'; m.confirm=''; render(); return; }
    if(state.users.some(u=>u.username.toLowerCase()===m.username.trim().toLowerCase())){ m.error='Esse usuário já existe.'; render(); return; }
    const newUser = { id:uid('user'), name:m.name.trim(), username:m.username.trim(), passwordHash: simpleHash(m.password), createdAt:new Date().toISOString() };
    state.users.push(newUser); persist('users');
    state.ui.modal = null; render();
  },
  editUserName(t){ const u = state.users.find(x=>x.id===t.dataset.id); state.ui.modal = {type:'editUser', data:{id:u.id,name:u.name}}; render(); },
  openResetPw(t){ const u = state.users.find(x=>x.id===t.dataset.id); state.ui.modal = {type:'resetPw', userId:u.id, userName:u.name, pw:'', pw2:''}; render(); },
  deleteUser(t){
    if(t.dataset.id===state.currentUser.id){ notify.err('Você não pode excluir a própria conta enquanto está conectado.'); return; }
    if(!confirm('Excluir este usuário?')) return;
    state.users = state.users.filter(u=>u.id!==t.dataset.id); persist('users'); render();
  },
  submitEditUser(){
    const d = state.ui.modal.data;
    if(!d.name || !d.name.trim()){ notify.err('Informe o nome.'); return; }
    state.users = state.users.map(u=> u.id===d.id ? {...u, name:d.name.trim()} : u); persist('users');
    if(state.currentUser && state.currentUser.id===d.id) state.currentUser = state.users.find(u=>u.id===d.id);
    state.ui.modal=null; render();
  },
  submitResetPw(){
    const m = state.ui.modal;
    if(!m.pw || m.pw.length<4){ notify.err('A senha deve ter ao menos 4 caracteres.'); return; }
    if(m.pw!==m.pw2){ notify.err('As senhas não conferem.'); return; }
    state.users = state.users.map(u=> u.id===m.userId? {...u, passwordHash: simpleHash(m.pw)} : u); persist('users');
    if(state.currentUser && state.currentUser.id===m.userId) state.currentUser = state.users.find(u=>u.id===m.userId);
    state.ui.modal=null; render(); notify.ok('Senha alterada.');
  },
  async exportBackup(){
    const backup = { customers: state.customers, products: state.products, sales: state.sales, orders: state.orders, users: state.users, categories: state.categories, subcategories: state.subcategories, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(backup,null,2)], {type:'application/json'});
    await saveFile('essencia-backup-'+todayISO()+'.json', blob);
  },
  async exportDataSQL(){
    const totalRecords = state.customers.length+state.products.length+state.sales.length+state.orders.length+state.users.length+state.categories.length+state.subcategories.length;
    if(!totalRecords){ notify.err('Não há dados cadastrados para exportar ainda.'); return; }
    const sql = buildDataSQL();
    const blob = new Blob([sql], {type:'application/sql;charset=utf-8;'});
    await saveFile('essencia-dados-'+todayISO()+'.sql', blob);
    notify.ok('Arquivo SQL gerado. Importe no phpMyAdmin do seu banco da Hostinger, depois do schema.sql.');
  }
};

window.importBackupFile = function(input){
  const file = input.files[0];
  if(!file) return;
  if(!confirm('Importar este backup vai substituir todos os dados atuais. Continuar?')) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      const data = JSON.parse(e.target.result);
      state.customers = data.customers||[]; persist('customers');
      state.products = data.products||[]; persist('products');
      state.sales = data.sales||[]; persist('sales');
      state.users = data.users||[]; persist('users');
      state.categories = (data.categories && data.categories.length) ? data.categories : loadInitialCategories(); persist('categories');
      state.subcategories = data.subcategories||[]; persist('subcategories');
      state.orders = data.orders||[]; persist('orders');
      notify.ok('Backup importado com sucesso.');
      render();
    }catch(err){ notify.err('Arquivo de backup inválido.'); }
  };
  reader.readAsText(file);
};

function renderInvoiceOrderModal(m){
  const order = state.orders.find(o=>o.id===m.orderId);
  if(!order) return modalWrap('Faturar pedido', '<p class="muted">Pedido não encontrado.</p>');
  const paid = m.payments.reduce((a,p)=>a+Math.max(0, parseFloat(p.amount)||0),0);
  const diff = +(order.total-paid).toFixed(2);
  const body = `
    <p class="muted" style="font-size:13px;margin-bottom:14px;">Faturando <b style="color:var(--ink);">${esc(order.orderNumber)}</b> · ${esc(order.customerName)}</p>
    <div class="flex-between serif" style="font-size:20px;margin-bottom:16px;color:var(--plum);"><span>Total a receber</span><span>${brl(order.total)}</span></div>
    <div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-bottom:8px;">Como foi pago</div>
    ${m.payments.map((p,idx)=>`
      <div class="flex gap mb1">
        <select style="flex:1.3;" data-field="ui.modal.payments.${idx}.method">
          ${PAYMENT_METHODS.map(pm=>`<option value="${pm}" ${p.method===pm?'selected':''}>${pm}</option>`).join('')}
        </select>
        <input type="number" step="0.01" min="0" placeholder="valor" style="flex:1;" data-field="ui.modal.payments.${idx}.amount" value="${esc(p.amount)}">
        ${m.payments.length>1? `<button class="icon-btn danger-c" data-action="removeInvoicePayment" data-idx="${idx}">${icon('close',14)}</button>`:''}
      </div>`).join('')}
    <button class="btn" style="color:var(--plum);font-size:12px;padding:4px 0;" data-action="addInvoicePayment">+ adicionar forma de pagamento</button>
    <div class="${Math.abs(diff)>0.009?'danger-c':'ok-c'}" style="font-size:12px;margin:12px 0;">
      ${Math.abs(diff)>0.009 ? (diff>0? 'Faltam '+brl(diff) : 'Passou '+brl(-diff))+' para fechar o total' : 'Valor confere com o total do pedido'}
    </div>
    <div class="flex" style="justify-content:flex-end;gap:8px;margin-top:8px;">
      <button class="btn btn-ghost" data-action="closeModal">Cancelar</button>
      <button class="btn btn-gold" data-action="confirmInvoiceOrder">${icon('check')} Confirmar faturamento</button>
    </div>`;
  return modalWrap('Faturar pedido', body);
}

function renderCustomerHistoryModal(m){
  const c = state.customers.find(x=>x.id===m.customerId);
  if(!c) return modalWrap('Cliente', '<p class="muted">Cliente não encontrado.</p>');
  const mySales = state.sales.filter(s=> s.customerId===c.id && s.status!=='cancelada');
  const totalSpent = mySales.reduce((a,s)=>a+s.total,0);
  const avg = mySales.length? totalSpent/mySales.length : 0;
  const last = mySales.length? mySales.map(s=>s.date).sort().slice(-1)[0] : null;
  const prodCount = {};
  mySales.forEach(s=> s.items.forEach(i=>{ prodCount[i.name]=(prodCount[i.name]||0)+i.qty; }));
  const fav = Object.entries(prodCount).sort((a,b)=>b[1]-a[1])[0];
  const body = `
    <div class="grid grid-3 mb2">
      <div class="card kpi" style="padding:13px;"><div class="klabel">Compras</div><div class="kval" style="font-size:20px;">${mySales.length}</div></div>
      <div class="card kpi" style="padding:13px;"><div class="klabel">Total gasto</div><div class="kval" style="font-size:20px;">${brl(totalSpent)}</div></div>
      <div class="card kpi" style="padding:13px;"><div class="klabel">Ticket médio</div><div class="kval" style="font-size:20px;">${brl(avg)}</div></div>
    </div>
    <p style="font-size:13px;" class="muted mb2">
      ${c.phone? 'Telefone: '+esc(c.phone)+' · ' : ''}${c.email? esc(c.email)+' · ' : ''}
      ${last? 'Última compra em '+fmtDate(last) : 'Ainda sem compras registradas'}
      ${fav? ' · Preferido: <b style="color:var(--ink);">'+esc(fav[0])+'</b> ('+fav[1]+' un.)' : ''}
    </p>
    ${mySales.length===0 ? '<p class="muted2" style="font-size:13px;">Este cliente ainda não tem compras registradas.</p>' : `
    <div class="table-wrap">
      <table>
        <thead><tr><th>Data</th><th>Itens</th><th>Pagamento</th><th style="text-align:right;">Total</th></tr></thead>
        <tbody>${mySales.slice().sort((a,b)=> new Date(b.date)-new Date(a.date)).map(s=>`
          <tr><td class="muted" style="white-space:nowrap;">${fmtDate(s.date)}</td>
          <td style="font-size:12.5px;">${esc(s.items.map(i=>i.qty+'x '+i.name).join(', '))}</td>
          <td>${s.payments.map(x=>x.method).join(', ')}</td>
          <td style="text-align:right;">${brl(s.total)}</td></tr>`).join('')}</tbody>
      </table>
    </div>`}
    <div class="flex" style="justify-content:flex-end;gap:8px;margin-top:16px;">
      <button class="btn btn-ghost" data-action="closeModal">Fechar</button>
    </div>`;
  return modalWrap('Histórico · '+esc(c.name), body, true);
}

/* ================= modal ================= */
function renderModal(){
  const m = state.ui.modal;
  if(m.type==='cliente') return renderClienteModal(m.data);
  if(m.type==='produto') return renderProdutoModal(m.data);
  if(m.type==='ajuste') return renderAjusteModal(m);
  if(m.type==='editUser') return renderEditUserModal(m.data);
  if(m.type==='resetPw') return renderResetPwModal(m);
  if(m.type==='import') return renderImportModal(m);
  if(m.type==='bulkImages') return renderBulkImagesModal(m);
  if(m.type==='newUser') return renderNewUserModal(m);
  if(m.type==='customerHistory') return renderCustomerHistoryModal(m);
  if(m.type==='invoiceOrder') return renderInvoiceOrderModal(m);
  if(m.type==='categories') return renderCategoriesModal(m);
  if(m.type==='exportProducts') return renderExportProductsModal(m);
  return '';
}

function modalWrap(title, body, wide){
  return `
  <div class="modal-overlay" data-action="closeModalOverlay">
    <div class="modal-box ${wide?'wide':''}">
      <div class="modal-head"><h3 class="serif plum" style="margin:0;font-size:18px;">${title}</h3><button class="icon-btn" data-action="closeModal">${icon('close')}</button></div>
      <div class="modal-body">${body}</div>

  </div>`;
}

      ${(o.status==='Rascunho'||o.status==='Pendente') ? `<button class="btn btn-gold" data-action="invoiceOrder" data-id="${o.id}">${icon('cart')} Faturar</button>`:''}
    </div>`;
  return modalWrap('Pedido · '+esc(o.orderNumber), body);
}

/* ================= actions dispatcher ================= */
const actions = {
  goTab(t){ state.tab = t.dataset.tab; state.ui.addMenuOpen = false; render(); },
  logout(){ state.currentUser = null; state.tab='dashboard'; state.ui.login = {mode:null,name:'',username:'',password:'',confirm:'',showPw:false,error:'',busy:false}; render(); },
  closeModal(){ state.ui.modal = null; render(); },
  filterProductCategory(t){ state.tab='produtos'; state.ui.productCategory = t.dataset.cat||''; state.ui.productSubcategory=''; render(); },
  filterProductSubcategory(t){ state.ui.productSubcategory = t.dataset.sub||''; render(); },
  openCategoriesManager(){ state.ui.addMenuOpen=false; state.ui.modal = {type:'categories', newName:'', expandedCategory:null, newSubName:''}; render(); },
  addCategory(){
    const m = state.ui.modal;
    const name = (m.newName||'').trim();
    if(!name){ notify.err('Digite o nome da categoria.'); return; }
    if(state.categories.some(c=>c.name.toLowerCase()===name.toLowerCase())){ notify.err('Essa categoria já existe.'); return; }
    state.categories.push({id:uid('cat'), name});
    persist('categories');
    m.newName='';
    render();
    notify.ok('Categoria adicionada.');
  },
  renameCategory(t){
    const cat = state.categories.find(c=>c.id===t.dataset.id);
    if(!cat) return;
    const novo = prompt('Novo nome para a categoria:', cat.name);
    if(novo===null) return;
    const trimmed = novo.trim();
    if(!trimmed){ notify.err('O nome não pode ficar em branco.'); return; }
    if(state.categories.some(c=>c.id!==cat.id && c.name.toLowerCase()===trimmed.toLowerCase())){ notify.err('Já existe uma categoria com esse nome.'); return; }
    const oldName = cat.name;
    cat.name = trimmed;
    persist('categories');
    // cascade: update products that used the old category name
    let changed = 0;
    state.products = state.products.map(p=>{
      if(p.category===oldName){ changed++; return {...p, category:trimmed}; }
      return p;
    });
    if(changed) persist('products');
    if(state.ui.productCategory===oldName) state.ui.productCategory = trimmed;
    render();
    notify.ok('Categoria renomeada'+(changed? ' e atualizada em '+changed+' produto(s).':'.'));
  },
  deleteCategory(t){
    const cat = state.categories.find(c=>c.id===t.dataset.id);
    if(!cat) return;
    const inUse = state.products.filter(p=>p.category===cat.name).length;
    const subCount = state.subcategories.filter(sc=>sc.category===cat.name).length;
    const msg = inUse>0
      ? 'Excluir a categoria "'+cat.name+'"? '+inUse+' produto(s) usam esse nome e continuarão com ele, só deixará de aparecer na lista rápida.'+(subCount? ' Os '+subCount+' subgrupo(s) dela também serão removidos.':'')
      : 'Excluir a categoria "'+cat.name+'"?';
    if(!confirm(msg)) return;
    state.categories = state.categories.filter(c=>c.id!==cat.id);
    state.subcategories = state.subcategories.filter(sc=>sc.category!==cat.name);
    persist('categories'); persist('subcategories');
    if(state.ui.productCategory===cat.name) state.ui.productCategory='';
    if(state.ui.modal && state.ui.modal.expandedCategory===cat.id) state.ui.modal.expandedCategory=null;
    render();
    notify.ok('Categoria excluída.');
  },
  toggleCategoryExpand(t){
    const m = state.ui.modal;
    m.expandedCategory = (m.expandedCategory===t.dataset.id) ? null : t.dataset.id;
    m.newSubName = '';
    render();
  },
  addSubcategory(t){
    const m = state.ui.modal;
    const category = t.dataset.cat;
    const name = (m.newSubName||'').trim();
    if(!name){ notify.err('Digite o nome do subgrupo.'); return; }
    if(state.subcategories.some(sc=>sc.category===category && sc.name.toLowerCase()===name.toLowerCase())){ notify.err('Esse subgrupo já existe nesta categoria.'); return; }
    state.subcategories.push({id:uid('subcat'), name, category});
    persist('subcategories');
    m.newSubName='';
    render();
    notify.ok('Subgrupo adicionado.');
  },
  renameSubcategory(t){
    const sc = state.subcategories.find(x=>x.id===t.dataset.id);
    if(!sc) return;
    const novo = prompt('Novo nome para o subgrupo:', sc.name);
    if(novo===null) return;
    const trimmed = novo.trim();
    if(!trimmed){ notify.err('O nome não pode ficar em branco.'); return; }
    if(state.subcategories.some(x=>x.id!==sc.id && x.category===sc.category && x.name.toLowerCase()===trimmed.toLowerCase())){ notify.err('Já existe um subgrupo com esse nome nesta categoria.'); return; }
    const oldName = sc.name;
    sc.name = trimmed;
    persist('subcategories');
    let changed=0;
    state.products = state.products.map(p=>{
      if(p.category===sc.category && p.subcategory===oldName){ changed++; return {...p, subcategory:trimmed}; }
      return p;
    });
    if(changed) persist('products');
    render();
    notify.ok('Subgrupo renomeado'+(changed? ' e atualizado em '+changed+' produto(s).':'.'));
  },
  deleteSubcategory(t){
    const sc = state.subcategories.find(x=>x.id===t.dataset.id);
    if(!sc) return;
    const inUse = state.products.filter(p=>p.category===sc.category && p.subcategory===sc.name).length;
    if(!confirm('Excluir o subgrupo "'+sc.name+'"?'+(inUse? ' '+inUse+' produto(s) continuarão com esse texto, só sairá da lista rápida.':''))) return;
    state.subcategories = state.subcategories.filter(x=>x.id!==sc.id);
    persist('subcategories');
    render();
    notify.ok('Subgrupo excluído.');
  },
  toggleMenu(){ state.ui.menuOpen = !state.ui.menuOpen; render(); },
  gotoProduct(t){ const p=state.products.find(x=>x.id===t.dataset.id); state.ui.globalQuery=''; state.tab='produtos'; state.ui.productQuery = p? p.name : ''; render(); },
  gotoCustomer(t){ const c=state.customers.find(x=>x.id===t.dataset.id); state.ui.globalQuery=''; state.tab='clientes'; state.ui.clientQuery = c? c.name : ''; render(); },
  closeModalOverlay(t,e){ if(e.target===t){ state.ui.modal=null; render(); } },
  ...actions_login,
  ...actions_clientes,
  ...actions_produtos,
  ...actions_estoque,
  ...actions_vendas,
  ...actions_pedidos,
  ...actions_usuarios
};

document.addEventListener('click', function(e){
  if(state.ui.addMenuOpen && !e.target.closest('.dropdown')){ state.ui.addMenuOpen = false; render(); }
});

/* patch render to include sale/order detail modal on top */
const _renderShell = renderShell;
renderShell = function(){
  return _renderShell() + renderSaleDetailIfAny() + renderOrderDetailIfAny();
};
/* close sale/order detail on overlay click needs its own dispatch since it's separate from state.ui.modal */
document.addEventListener('click', function(e){
  const t = e.target;
  if(t.classList && t.classList.contains('modal-overlay')){
    if(state.ui.saleDetail){ state.ui.saleDetail = null; render(); }
    if(state.ui.orderDetail){ state.ui.orderDetail = null; render(); }
  }
});
document.addEventListener('click', function(e){
  const t = e.target.closest('[data-action="closeModal"]');
  if(!t || state.ui.modal) return;
  if(state.ui.saleDetail){ state.ui.saleDetail = null; render(); }
  if(state.ui.orderDetail){ state.ui.orderDetail = null; render(); }
});

/* ================= init ================= */
applyPrefs();
render();
syncStartup().then(()=>{ if(!SYNC.busy) render(); });
syncDetectServer();
syncStartTimers();
</script>
